# Builds Feather PDF for Android, checks it (the engine bridge on Linux, the APK's contents and signature, and the app
# itself on an Android emulator), and puts the APK in releases/ with a commit to the same branch.
name: Android build

on:
  push:
    paths: ["Android/**", "shared/**", "tests/android/**", "CMakeLists.txt", "cmake/**", "scripts/fetch-pdfium.sh", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to commit the APK to releases/

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: PDFium for Android (and Linux, for the bridge check)
        run: |
          bash scripts/fetch-pdfium.sh android
          bash scripts/fetch-pdfium.sh linux
          ls -la third_party/pdfium-android/*/lib/libpdfium.so

      - name: The engine bridge works (built for Linux, driven from Java)
        run: |
          sudo apt-get install -y -q ninja-build clang >/dev/null
          python3 -m pip install --quiet --only-binary=:all: reportlab pikepdf pdfminer.six pillow
          bash tests/android/bridge_check.sh

      - name: Build the APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease bundleRelease
          ls -la app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Each APK holds its kind of phone's libraries, is signed with the release key, aligned for 16 KB pages, under 20 MB
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for abi in arm64-v8a armeabi-v7a x86_64; do
            apk=Android/app/build/outputs/apk/release/app-$abi-release.apk
            echo "== $abi: $(stat -c %s "$apk") bytes"
            for lib in libpdfium.so libfeatherpdf.so libc++_shared.so; do unzip -l "$apk" | grep -q "lib/$abi/$lib" || { echo "missing lib/$abi/$lib"; exit 1; }; done
            # the open-source licences About shows
            [ "$(unzip -l "$apk" | grep -c "assets/licenses/")" -ge 5 ] || { echo "the licence texts are missing from the $abi APK"; exit 1; }
            if unzip -l "$apk" | grep "lib/" | grep -v "lib/$abi/" | grep -q "\.so"; then echo "other phones' libraries in the $abi APK"; exit 1; fi
            # the download mirror (jsDelivr) serves files up to 20 MB
            [ "$(stat -c %s "$apk")" -lt 20000000 ] || { echo "the $abi APK is 20 MB or more"; exit 1; }
            "$bt/apksigner" verify --print-certs "$apk" > certs.txt
            grep -qi "5ece1a1bb33b104247f9bffd5069a2946b8f7de37ccb51176e751f0b5ebbee12" certs.txt || { echo "not signed with the Feather PDF release key"; exit 1; }
            "$bt/zipalign" -c -P 16 4 "$apk" && echo "aligned for 16 KB pages"
          done
          "$bt/aapt2" dump badging Android/app/build/outputs/apk/release/app-arm64-v8a-release.apk | head -3
          # the app bundle for Google Play: signed with the same (upload) key, every kind of phone inside
          aab=Android/app/build/outputs/bundle/release/app-release.aab
          jarsigner -verify "$aab" | tail -1
          keytool -printcert -jarfile "$aab" | grep -i "SHA256:" | tr -d ': ' | grep -qi "5ece1a1bb33b104247f9bffd5069a2946b8f7de37ccb51176e751f0b5ebbee12" || { echo "the bundle is not signed with the Feather PDF key"; exit 1; }
          for abi in arm64-v8a armeabi-v7a x86_64; do unzip -l "$aab" | grep -q "base/lib/$abi/libpdfium.so" || { echo "the bundle lacks $abi"; exit 1; }; done
          echo "bundle: $(stat -c %s "$aab") bytes"

      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: The app on an emulator (Android 14)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_2   # 1080 x 1920: its pictures are also the store's phone screenshots
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/android/emulator_check.sh Android/app/build/outputs/apk/release/app-x86_64-release.apk emulator-check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FeatherPDF-android
          path: |
            Android/app/build/outputs/apk/release/*.apk
            Android/app/build/outputs/bundle/release/*.aab
            emulator-check/

      - name: Put the APK in releases/
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          ver=$(grep -oP 'project\(FeatherPDF VERSION \K[0-9.]+' CMakeLists.txt)
          rm -f releases/*-android.apk releases/*-android-32bit.apk
          # the download for phones (64-bit, nearly all), and one for older 32-bit phones
          cp Android/app/build/outputs/apk/release/app-arm64-v8a-release.apk "releases/FeatherPDF-$ver-android.apk"
          cp Android/app/build/outputs/apk/release/app-armeabi-v7a-release.apk "releases/FeatherPDF-$ver-android-32bit.apk"
          # for Google Play (not for downloading): the app bundle, and up to 8 of the emulator's pictures at full size
          rm -f releases/*-android.aab
          cp Android/app/build/outputs/bundle/release/app-release.aab "releases/FeatherPDF-$ver-android.aab"
          mkdir -p Android/store/screenshots && rm -f Android/store/screenshots/*
          for f in emulator-check/selftest/0[1-6]-*.png emulator-check/settings/08-settings.png emulator-check/settings/09-settings-3-editing.png; do
            [ -f "$f" ] && python3 -c "from PIL import Image; import sys; Image.open(sys.argv[1]).convert('RGB').save(sys.argv[2], quality=90)" "$f" "Android/store/screenshots/$(basename "${f%.png}").jpg"
          done
          git config user.name "Feather PDF Android build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the emulator's pictures of the app, small, for the README and for checking the screen by eye
          mkdir -p docs/android && rm -f docs/android/*.png
          python3 -c "
          import glob, os
          from PIL import Image
          for f in sorted(glob.glob('emulator-check/selftest/*.png')) + sorted(glob.glob('emulator-check/settings/*.png')) + ['emulator-check/00-start.png']:
              if os.path.exists(f):
                  im = Image.open(f).convert('RGB'); im.thumbnail((540, 1200))
                  im.save('docs/android/' + os.path.basename(f), optimize=True)
          "
          git add -A releases docs/android Android/store/screenshots
          git commit -q -m "Android APK built from ${GITHUB_SHA::7}" || { echo "unchanged"; exit 0; }
          # the Mac build may have committed to the branch meanwhile: take its commit and try again
          for i in 1 2 3 4; do
            git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((i * 10))
          done
          echo "the branch moved on; the next build puts its APK in releases/"
