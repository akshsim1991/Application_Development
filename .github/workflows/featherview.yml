name: FeatherView

on:
  push:
    paths: ['FeatherView-Windows/**', '.github/workflows/featherview.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: FeatherView-Windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test tests/FeatherView.Tests -c Release --logger "trx;LogFileName=results.trx"

      - name: Publish (self-contained, ReadyToRun)
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          dotnet publish src/FeatherView.App -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:DebugType=none -p:Version=$v -o publish/win-x64
          dotnet publish src/FeatherView.App -c Release -r win-x64 --self-contained false -p:DebugType=none -p:Version=$v -o publish/fxdep

      - name: Smoke test (start-up time, memory, responsiveness)
        shell: pwsh
        run: ./tools/smoke.ps1

      - name: Screenshots (only when the commit message contains [shots])
        if: contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        shell: pwsh
        run: ./tools/screenshots.ps1

      - name: Commit screenshots
        if: contains(github.event.head_commit.message, '[shots]')
        continue-on-error: true
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots
          git commit -m "CI: refresh screenshots [skip ci]"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}

      - name: Installer and portable ZIP
        shell: pwsh
        run: |
          $v = (Get-Content VERSION).Trim()
          choco install innosetup -y --no-progress | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\FeatherView.iss
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer\FeatherView-small.iss
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish\win-x64\* -DestinationPath "dist\FeatherView-$v-portable-win-x64.zip" -Force
          Compress-Archive -Path publish\fxdep\* -DestinationPath "dist\FeatherView-$v-framework-dependent-win-x64.zip" -Force
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} | Format-Table | Out-String | Write-Host

      - name: Update manifest (latest.json for the releases repo)
        shell: pwsh
        run: ./tools/make-latest-json.ps1

      - name: GitHub Release - becomes the 'latest' release that installed apps update from (only when the commit message contains [release])
        if: contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Get-Content VERSION).Trim()
          $tag = "featherview-v$v"
          $setup = "dist/FeatherView-Setup-$v.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          Feather View $v

          Files
          - FeatherView-Setup-$v.exe: full installer (about 44 MB; 64-bit Windows 10 1809 or later; includes the .NET runtime, no prerequisites)
          - FeatherView-Setup-small-$v.exe: small installer (a couple of MB) for PCs that have the .NET 10 Desktop Runtime; updates are then tiny too
          - FeatherView-$v-portable-win-x64.zip: no install needed, unzip and run FeatherView.exe
          - FeatherView-$v-framework-dependent-win-x64.zip: small download, needs the .NET 10 Desktop Runtime installed
          - latest.json: update manifest (for the releases repository)

          Installer SHA-256: $hash

          Early version: the app starts, its unit tests pass and full screen was checked on a Windows runner in CI; other screens have had limited hands-on testing. The installer is not code-signed, so Windows SmartScreen may show an "unknown publisher" warning. Installed copies of 0.1.1 and later check this release for updates automatically (Settings > Updates). Download only the one installer you need, not the CI artifact bundle.
          "@
          # A re-run replaces the release so its tag points at the commit that was just built.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag $setup "dist/FeatherView-Setup-small-$v.exe" "dist/FeatherView-$v-portable-win-x64.zip" "dist/FeatherView-$v-framework-dependent-win-x64.zip" dist/latest.json --title "Feather View $v" --notes "$notes" --latest --target ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: FeatherView-${{ github.run_number }}
          path: |
            FeatherView-Windows/dist/*
            FeatherView-Windows/tests/FeatherView.Tests/TestResults/results.trx
