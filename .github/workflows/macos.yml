# Builds Feather PDF for macOS on a Mac (Apple silicon and Intel in one app), checks it, and puts the disk image in
# releases/ (next to the Windows installer) with a commit to the same branch. That commit does not start this workflow
# again (pushes made with the workflow's own token never do).
name: macOS build

on:
  push:
    paths: ["macOS/**", "shared/**", "tests/engine/**", "tests/make_samples.py", "CMakeLists.txt", "cmake/**", "scripts/fetch-pdfium.sh", ".github/workflows/macos.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to commit the disk image to releases/

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: PDFium for macOS
        run: bash scripts/fetch-pdfium.sh mac

      - name: Build the app
        run: |
          cmake -S . -B build-mac -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build-mac -j 4 -- -k || { echo "=== errors ==="; cmake --build build-mac -j 1 2>&1 | grep -E "error:" | sort -u; exit 1; }
          file "build-mac/Feather PDF.app/Contents/MacOS/Feather PDF"
          codesign --verify --deep --strict "build-mac/Feather PDF.app" && echo "signature ok"

      - name: The engine gives the Windows app's results
        run: bash tests/engine/check.sh "$PWD/build-mac/Feather PDF.app/Contents/MacOS/Feather PDF"

      - uses: actions/setup-python@v5   # a Python the checking tools (pikepdf) have ready-made packages for
        with:
          python-version: "3.12"

      - name: The command line features work as on Windows
        run: |
          python3 -m pip install --quiet --only-binary=:all: reportlab pillow numpy pikepdf python-docx openpyxl pdfminer.six cryptography fonttools
          bash tests/engine/cli_check.sh "$PWD/build-mac/Feather PDF.app/Contents/MacOS/Feather PDF" jpeg

      - name: Real PDFs from other programs are edited correctly (Google Docs, LaTeX, htmldoc, TCPDF)
        run: bash tests/engine/realworld.sh "$PWD/build-mac/Feather PDF.app/Contents/MacOS/Feather PDF"

      - name: Pages are drawn (normal, night and blackboard colours)
        run: |
          app="build-mac/Feather PDF.app/Contents/MacOS/Feather PDF"
          "$app" --render tests/engine/golden/in/qp.pdf 1 page.png 1.5
          "$app" --render tests/engine/golden/in/qp.pdf 1 dark.png 1.5 dark
          sips -g pixelWidth -g pixelHeight page.png
          [ "$(sips -g pixelWidth page.png | awk '/pixelWidth/{print $2}')" = "918" ]
          ! cmp -s page.png dark.png
          "$app" --render tests/engine/golden/in/qp.pdf 1 bb.png 1.5 blackboard
          "$app" --render tests/engine/golden/in/qp.pdf 1 bbo.png 1.5 blackboard-original
          python3 -c "from PIL import Image;[print(f, Image.open(f).convert('RGB').getpixel((3,3))) for f in ('page.png','bb.png','bbo.png')];assert Image.open('bb.png').convert('RGB').getpixel((3,3))==(0,0,0)==Image.open('bbo.png').convert('RGB').getpixel((3,3))"

      - name: The app opens documents in tabs and draws its window
        run: |
          app="build-mac/Feather PDF.app/Contents/MacOS/Feather PDF"
          in="$PWD/tests/engine/golden/in"
          run() { "$@" & local p=$!; for i in $(seq 1 60); do kill -0 $p 2>/dev/null || { wait $p; return; }; sleep 1; done; sample $p 2 -file /tmp/stuck.txt >/dev/null 2>&1; kill -9 $p; echo "the app did not finish: $*"; grep -A40 "Thread_.*DispatchQueue_1:" /tmp/stuck.txt | cut -c1-200; for d in ui*; do cat $d/trace.txt 2>/dev/null; done; return 1; }
          run env FEATHER_UI_CHECK="$PWD/ui-start" "$app"
          run env FEATHER_UI_CHECK="$PWD/ui" "$app" "$in/qp.pdf" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-dark" "$app" "$in/qp.pdf" -pageColours 1
          run env FEATHER_UI_CHECK="$PWD/ui-blackboard" "$app" "$in/qp.pdf" -pageColours 4
          run env FEATHER_UI_CHECK="$PWD/ui-props" FEATHER_UI_ACTION=showProperties: "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-fonts" FEATHER_UI_ACTION=showFonts: "$app" "$in/qp.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-marks" FEATHER_UI_ACTION=showBookmarksPanel: "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-thumbs" FEATHER_UI_ACTION=selectAllPages: "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-rulers" FEATHER_UI_ACTION=toggleRulers: "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-ocr" FEATHER_UI_ACTION=recogniseText: "$app" "$in/hf_basic.pdf"
          python3 tests/make_samples.py "$PWD/ui-samples" >/dev/null 2>&1 || true
          python3 -c "import pikepdf;p=pikepdf.open('ui-samples/order.pdf');f={str(x.T):x for x in p.Root.AcroForm.Fields};f['price'].V='200';f['tax'].V='18.09';p.Root.AcroForm.NeedAppearances=True;p.save('ui-samples/fc-filled.pdf')" || true
          run env FEATHER_UI_CHECK="$PWD/ui-edpara" FEATHER_UI_ACTION=uiEditAt: FEATHER_UI_EDIT="200 750 para" "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-edline" FEATHER_UI_ACTION=uiEditAt: FEATHER_UI_EDIT="200 750 line" "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-editmode" FEATHER_UI_ACTION=uiEditMode: FEATHER_UI_EDITMODE="200 750" FEATHER_UI_WAIT=7 "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-tabmenu" FEATHER_UI_ACTION=uiTabMenu: "$app" "$in/qp.pdf" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-rotate" FEATHER_UI_ACTION=uiRotateToolbar: FEATHER_UI_WAIT=6 "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-box" FEATHER_UI_ACTION=uiBoxSelect: FEATHER_UI_WAIT=6 "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-bar" FEATHER_UI_ACTION=uiToolbarButtons: FEATHER_UI_WAIT=6 "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-print" FEATHER_UI_ACTION=printDocument: FEATHER_UI_WAIT=8 "$app" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-sbs" FEATHER_UI_ACTION=sideBySideWithTab: FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$in/qp.pdf" "$in/hf_basic.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-ocrrun" FEATHER_UI_ACTION=recogniseText: FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=40 "$app" "$PWD/ui-samples/scan.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-interleave" FEATHER_UI_ACTION=interleaveScan: FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/duplex.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-combine" FEATHER_UI_ACTION=combinePdfs: FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/book.pdf" "$PWD/ui-samples/appendix.pdf"
          python3 -c "from PIL import Image;Image.new('RGB',(800,600),(30,120,200)).save('ui-samples/photo.png')"
          run env FEATHER_UI_CHECK="$PWD/ui-convert" FEATHER_UI_CONVERT="$PWD/ui-samples/photo.png" FEATHER_UI_WAIT=6 "$app"
          run env FEATHER_UI_CHECK="$PWD/ui-merge" FEATHER_UI_ACTION=mergeFiles: FEATHER_UI_MERGE="$PWD/ui-samples/appendix.pdf" FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/book.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-split" FEATHER_UI_ACTION=splitDocument: FEATHER_UI_SPLIT=3 FEATHER_UI_SPLIT_TO="$PWD/ui-samples/part" FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/book.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-compare" FEATHER_UI_ACTION=compareDocuments: FEATHER_UI_COMPARE="$PWD/ui-samples/version2.pdf" FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=8 "$app" "$PWD/ui-samples/version1.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-layers" FEATHER_UI_ACTION=showLayers: FEATHER_UI_LAYERS_FLIP=1 FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/layers.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-attach" FEATHER_UI_ACTION=showAttachments: FEATHER_UI_ATTACH=1 FEATHER_UI_ATTACH_TO="$PWD/ui-samples/saved-notes.txt" FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/layers.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-repair" FEATHER_UI_ACTION=repairDocument: FEATHER_UI_REPAIR="$PWD/ui-samples/damaged-noindex.pdf" FEATHER_UI_WAIT=6 "$app"
          run env FEATHER_UI_CHECK="$PWD/ui-web" FEATHER_UI_ACTION=saveForWeb: FEATHER_UI_WEB_TO="$PWD/ui-samples/web.pdf" FEATHER_UI_WAIT=6 "$app" "$PWD/ui-samples/book.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-history" FEATHER_UI_ACTION=showUndoHistory: FEATHER_UI_HISTORY=1 FEATHER_UI_WAIT=6 "$app" "$PWD/ui-samples/book.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-access" FEATHER_UI_ACTION=accessibilityCheck: FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/access.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-review" FEATHER_UI_ACTION=reviewComments: FEATHER_UI_REVIEW="0|Looks right to me." FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/search.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-read" FEATHER_UI_ACTION=readAloud: FEATHER_FAKE_VOICE=1 FEATHER_UI_READ_FORWARD=1 FEATHER_UI_WAIT=6 "$app" "$PWD/ui-samples/version1.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-formcalc" FEATHER_UI_ACTION=formCalcDialog: FEATHER_UI_FORMCALC="total|6|price, tax" FEATHER_UI_PRESS=1 FEATHER_UI_WAIT=7 "$app" "$PWD/ui-samples/fc-filled.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-find" FEATHER_UI_ACTION=uiFind: FEATHER_UI_FIND="cat*|word wild comments" "$app" "$PWD/ui-samples/search.pdf"
          run env FEATHER_UI_CHECK="$PWD/ui-sensitive" FEATHER_UI_ACTION=findSensitiveInformation: FEATHER_UI_PRESS=2 FEATHER_UI_WAIT=11 "$app" "$PWD/ui-samples/sensitive.pdf"
          cat ui-start/report.txt; echo; cat ui/report.txt ui/trace.txt; echo; cat ui-dark/report.txt ui-dark/trace.txt
          grep -q 'window NSWindow "Feather PDF".*visible 1' ui-start/report.txt
          grep -q "^documents 2" ui/report.txt
          grep -q "tabs 2" ui/report.txt
          grep -q "Page 1 of 1" ui-dark/report.txt
          grep -q "Page 1 of 1" ui-blackboard/report.txt
          [ -f ui-props/sheet.png ] && [ -f ui-fonts/sheet.png ]
          for d in ui-bar ui-box ui-rotate ui-start ui ui-dark ui-blackboard ui-props ui-fonts ui-marks ui-thumbs ui-rulers ui-ocr ui-ocrrun ui-sbs ui-edpara ui-edline ui-editmode ui-print ui-sensitive ui-find ui-interleave ui-merge ui-combine ui-convert ui-split ui-compare ui-layers ui-attach ui-repair ui-web ui-history ui-access ui-review ui-read ui-formcalc; do
            for f in window sheet; do
              [ -f $d/$f.png ] || continue
              sips -s format jpeg -s formatOptions 50 $d/$f.png --out $d/$f.jpg >/dev/null
              echo "SCREENSHOT-BEGIN $d-$f"; base64 -b 120 -i $d/$f.jpg; echo "SCREENSHOT-END"
            done
          done
          for d in ui-*; do echo "== $d"; cat $d/trace.txt 2>/dev/null || true; done
          grep -q "press: sheet 1 button Show" ui-sbs/trace.txt && grep -q "side by side: 2 views" ui-sbs/trace.txt   # two documents in one window
          cat ui-editmode/trace.txt
          grep -q "edit bar 1" ui-editmode/trace.txt && grep -Eq "edit mode: tool [0-9]+, page 1 blocks [1-9]" ui-editmode/trace.txt   # one click: the bar and the outlines
          grep -Eq "edit mode click at 200,750: editor 1, caret [0-9]+ of [1-9]" ui-editmode/trace.txt   # a click in text opens the editor there
          grep -q "edit at 200,750: found 1" ui-edpara/trace.txt && grep -q "hidden [1-9]" ui-edpara/trace.txt   # the paragraph editor opens, the page's own text hidden
          grep -q "tab menu: Open Directory Having This File | Copy the File's Path | Open in New Window | Close Tab | Close Other Tabs" ui-tabmenu/trace.txt
          cat ui-rotate/trace.txt | grep "rotate toolbar"
          grep "box select\|objects picked" ui-box/trace.txt
          grep -Eq "box select: ([2-9]|[1-9][0-9]+) objects" ui-box/trace.txt   # a box with the Move tool picks several, each whole
          grep "toolbar items" ui-bar/trace.txt
          grep -Eq "toolbar items: .*fit night fullscreen print share.*; fit width 1 -> 0 -> 1; colours 0 -> 1 \(button 1\) -> 0; share gives 1" ui-bar/trace.txt   # fit, night, full screen, print, share
          grep -Eq "rotate toolbar: items .*\brotate\b.*; pages 842x595( 595x842){5}" ui-rotate/trace.txt   # the toolbar's rotate turns the page shown
          grep -q "thumbnails selected: 6" ui-thumbs/trace.txt   # Select All Pages selects every page
          grep -q "compare: 3 changes, 1 replaced, 1 inserted, 1 removed, 34 same" ui-compare/trace.txt && grep -q "showWindows Changes marked - version1.pdf" ui-compare/trace.txt && grep -q "showWindows Comparison report - version1.pdf" ui-compare/trace.txt   # the marked copy and the report open
          grep -q "layers: Plan A on; Plan B off;" ui-layers/trace.txt && grep -q "layers now: Plan A off; Plan B on;" ui-layers/trace.txt   # layers switched
          grep -q "attachments: notes.txt 18" ui-attach/trace.txt && [ "$(cat ui-samples/saved-notes.txt)" = "Attached notes: 42" ]   # attachment saved byte for byte
          grep -q "repair: opened 1 fixed 1 pages 9 problems 2" ui-repair/trace.txt && grep -q "showWindows damaged-noindex (repaired)" ui-repair/trace.txt   # repaired and opened
          grep -q "web copy:" ui-web/trace.txt && python3 -c "import pikepdf;p=pikepdf.open('ui-samples/web.pdf');assert p.is_linearized and p.check_linearization() and not p.get_warnings()"   # Fast Web View, checked by qpdf
          grep -q "history: Rotate pages; Insert a blank page; Reverse the page order;" ui-history/trace.txt && grep -q "history: went 3 step(s) back, ok 1, now 0 steps done, 3 undone, 9 pages" ui-history/trace.txt && grep -q "history: went 1 step(s) forward, ok 1, now 1 steps done, 2 undone, 9 pages" ui-history/trace.txt   # named steps, back and forward
          grep -q "access: 13 checks, 8 failed, 3 for a person, 6 fixable" ui-access/trace.txt && grep -q "access: fixed 6, still failed 2" ui-access/trace.txt   # accessibility checked and fixed
          grep -q "review: 2 comments" ui-review/trace.txt && grep -q "review: reply ok 1, first comment has 1 replies" ui-review/trace.txt   # a reply added to a comment
          grep -q "reading: 'Alpha' on page 1" ui-read/trace.txt && grep -q "reading: forward to 'The quick'" ui-read/trace.txt   # words followed, a sentence on
          grep -q "formcalc: set 1, total = 218.09" ui-formcalc/trace.txt   # a total set up and worked out
          grep -q "interleave: 6 pages, page 2 says Back 1" ui-interleave/trace.txt   # two-sided scan put in order
          grep -q "merge: 1 file(s), 11 pages, 4 bookmarks" ui-merge/trace.txt   # merged keeping every bookmark
          cat ui-combine/trace.txt ui-convert/trace.txt
          grep -Eq "combine: [2-9] documents, (1[1-9]|[2-9][0-9]) pages" ui-combine/trace.txt   # the open documents (book and appendix, and any the Mac reopened) combined into a new one
          grep -q "convert photo.png: 1" ui-convert/trace.txt && [ -f ui-samples/photo.pdf ] && python3 -c "import pikepdf;assert len(pikepdf.open('ui-samples/photo.pdf').pages)==1"   # Finder's Convert to PDF
          grep -q "split: 3 file(s)" ui-split/trace.txt && [ -f "ui-samples/part-2 Chapter Two.pdf" ] && python3 tests/outline_dump.py "ui-samples/part-2 Chapter Two.pdf" | grep -q "^3 Chapter Two->1;   Section 5.1->2$"   # at the chapters, bookmarks kept
          grep -q "find cat\*: 7" ui-find/trace.txt && grep -q "find: at 4 in a comment 1" ui-find/trace.txt   # whole words, wildcards, comments
          grep -q "sensitive: found 10" ui-sensitive/trace.txt && grep -q "sensitive: marked 10 items" ui-sensitive/trace.txt   # both forms, every item marked
          grep -q "press: sheet 1 button Recognise" ui-ocrrun/trace.txt && grep -q "^documents 1" ui-ocrrun/report.txt && grep -q "ocr words [1-9]" ui-ocrrun/trace.txt   # OCR from its form: words found, no crash

      - name: Recent files and settings survive an update (the app replaced as the updater replaces it)
        run: |
          app="build-mac/Feather PDF.app/Contents/MacOS/Feather PDF"
          bundle="build-mac/Feather PDF.app"
          in="$PWD/tests/engine/golden/in"
          defaults write com.featherpdf.mac pageColours -int 2
          env FEATHER_UI_CHECK="$PWD/ui-recent1" "$app" "$in/qp.pdf" || true
          cat ui-recent1/trace.txt | grep "recent documents" || true
          # the update: the app moved aside, the new one copied in its place (macOS/src/Updater.mm), then started
          ditto "$bundle" /tmp/FeatherPDF-new.app
          mv "$bundle" "$bundle.old" && ditto /tmp/FeatherPDF-new.app "$bundle" && rm -rf "$bundle.old"
          env FEATHER_UI_CHECK="$PWD/ui-recent2" "$app" || true
          cat ui-recent2/trace.txt | grep "recent documents"
          grep -q "recent documents [1-9].*qp.pdf" ui-recent2/trace.txt   # the recent list kept
          [ "$(defaults read com.featherpdf.mac pageColours)" = "2" ]       # and a setting
          defaults write com.featherpdf.mac pageColours -int 0

      - name: Disk image
        run: cmake --build build-mac --target dmg

      - uses: actions/upload-artifact@v4
        with:
          name: FeatherPDF-mac
          path: |
            dist/*.dmg
            ui/window.png
            ui-dark/window.png
            ui-blackboard/window.png
            page.png
            dark.png

      - name: Put the disk image in releases/
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          rm -f releases/*-mac.dmg
          cp dist/*-mac.dmg releases/
          git config user.name "Feather PDF Mac build"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A releases
          git commit -q -m "macOS disk image built from ${GITHUB_SHA::7}" || { echo "unchanged"; exit 0; }
          # the Android build may have committed to the branch meanwhile: take its commit and try again
          for i in 1 2 3 4; do
            # the same files built twice (pictures, installers) cannot be merged: this build's are the newer ones
            if git pull -q --rebase -X theirs origin "${GITHUB_REF_NAME}"; then git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            else git rebase --abort 2>/dev/null; fi
            sleep $((i * 10))
          done
          echo "the branch moved on; the next build puts its disk image in releases/"
