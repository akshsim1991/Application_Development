name: Build VoiceMate IPA
on:
  push:
    branches: [claude/eager-clarke-y5zafh]
    paths: ['VoiceMate-iOS/**', '.github/workflows/voicemate-ipa.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: brew install xcodegen && cd VoiceMate-iOS && xcodegen generate
      - name: Build unsigned app
        run: |
          cd VoiceMate-iOS
          xcodebuild -project VoiceMate.xcodeproj -scheme VoiceMate -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/VoiceMate.app Payload/
          zip -qr VoiceMate.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceMate-ipa
          path: VoiceMate-iOS/VoiceMate.ipa
