<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feather System Utilities</title>
<style>

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:88px 1fr;height:100vh}
.rail{background:var(--rail);color:#cfd6ea;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:1px;overflow:auto}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#19c3a8,#3b4bd8);display:grid;place-items:center;margin-bottom:8px;flex:none}
.nav{width:72px;padding:6px 0 4px;border-radius:14px;text-align:center;font-size:11px;color:#9fb0d4;cursor:pointer;border:0;background:none;flex:none}
.nav svg{display:block;width:22px;height:22px;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:#1a2a52;color:#fff}.nav.on{background:#223a74;color:#fff}.nav.on svg{stroke:#38e0c5}
.rail .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px 10px;flex:none}
.title h1{margin:0;font-size:22px;letter-spacing:-.2px}.title span{color:var(--mute);font-size:12.5px}
.top .grow{flex:1}
.banner{margin:0 28px 10px;padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;background:var(--infobg);color:var(--infofg);font-weight:600}
.banner.warn{background:var(--warnbg);color:var(--warnfg)}.banner button{margin-left:auto}
.view{flex:1;overflow:auto;padding:4px 28px 28px;user-select:text}
.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:default}
.pri{background:linear-gradient(180deg,#14b39d,#0b8f7d);color:#fff;box-shadow:0 6px 16px rgba(15,157,138,.28)}

.danger{background:var(--badbg);color:var(--badfg)}
.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1180px){.g3{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}

.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.big{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.15}.sub{color:var(--ink2)}.muted{color:var(--mute);font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--okfg)}.warn{background:var(--warnbg);color:var(--warnfg)}.bad{background:var(--badbg);color:var(--badfg)}.info{background:var(--infobg);color:var(--infofg)}.neutral{background:var(--soft);color:var(--ink2)}
.hero{background:linear-gradient(120deg,#14213d 0%,#23397a 60%,#2b6cb0 100%);color:#fff;border:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin-bottom:16px;padding:22px 26px}
.hero h2{margin:0 0 6px;font-size:23px;letter-spacing:-.3px}.hero p{margin:0;color:#c8d3f0;max-width:560px}.hero .btn{background:#fff;color:#14213d}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#14b39d,#3b4bd8)}.bar.hot b{background:linear-gradient(90deg,#e8a21c,#ef6f55)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}.row:first-child{border-top:0}.row .grow,.grow{flex:1;min-width:0}

.tabs{display:flex;gap:8px;margin-bottom:12px}
.tablewrap{overflow:auto;border-radius:14px;max-height:calc(100vh - 290px);border:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);padding:9px 10px;cursor:pointer;white-space:nowrap;z-index:1;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle;white-space:nowrap;max-width:340px;overflow:hidden;text-overflow:ellipsis}td .cut,td .nm{max-width:100%}tr.r{cursor:pointer}tr.r:hover td{background:var(--hover)}tr.sel td{background:var(--infobg)}
td.num,th.num{text-align:right;white-space:nowrap}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}.cut{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}

.side h4{margin:0 0 4px;font-size:16px;word-break:break-word}.evid{background:var(--soft);border-radius:12px;padding:11px 13px;margin:9px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}.evid b{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.empty{padding:36px;text-align:center;color:var(--mute)}
.tl{position:relative;margin-left:8px;padding-left:20px;border-left:2px solid var(--line)}.tl .ev{position:relative;padding:7px 0}.tl .ev:before{content:"";position:absolute;left:-27px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--teal)}.tl .ev.c:before{border-color:var(--coral)}.tl .ev.a:before{border-color:var(--amber)}
.tm{position:relative;height:430px;border-radius:14px;overflow:hidden;background:var(--soft)}.tm .c{position:absolute;border:2px solid var(--card);border-radius:8px;padding:7px 9px;color:#fff;font-size:12px;font-weight:600;overflow:hidden;cursor:pointer;line-height:1.25}.tm .c small{display:block;font-weight:500;opacity:.9}.tm .c:hover{filter:brightness(1.1)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;color:var(--mute)}.crumbs a{color:var(--indigo);cursor:pointer;font-weight:600}
.shade{position:fixed;inset:0;background:rgba(10,16,30,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:20px 24px 6px}.modal header h2{margin:0;font-size:19px}.modal .body{padding:6px 24px;overflow:auto;user-select:text}.modal footer{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal ul{margin:8px 0;padding:0;list-style:none}.modal li{padding:6px 10px;border-radius:9px;background:var(--soft);margin-bottom:4px;font-size:13px;word-break:break-all}
.busy{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 20px;border-radius:99px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:80vw}
.busy i{width:14px;height:14px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.busy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;right:24px;top:20px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);z-index:70;max-width:420px}.toast.err{border-left-color:var(--coral)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}.setrow:first-of-type{border-top:0}
input[type=number]{width:110px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.adv{cursor:help}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12.5px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
th.sorted{color:var(--ink)}th .arr{font-size:9px;margin-left:3px}
tr.r{user-select:none}tr.sel td{background:var(--infobg)}tr.fc td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.selbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--infobg);color:var(--infofg);border-radius:11px;margin-bottom:10px;font-weight:600;flex-wrap:wrap}.selbar a{cursor:pointer;text-decoration:underline;font-weight:500}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;max-width:190px}
.menu{position:fixed;left:84px;bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:230px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer}.menu button:hover{background:var(--hover)}
kbd{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.tool{border:1px solid var(--line2);border-radius:14px;padding:14px;background:var(--card)}.tool b{display:block}.tool .muted{margin:4px 0 10px}
</style></head>
<body>

</div>
<div id="layer"></div>
<script>

const NAV = [['today', 'Today'], ['clean', 'Clean'], ['programs', 'Programs'], ['startup', 'Startup'], ['services', 'Services'], ['drivers', 'Drivers'], ['procs', 'Processes'], ['files', 'Files'], ['storage', 'Storage'], ['tools', 'Tools'], ['privacy', 'Privacy'], ['trouble', 'Troubleshoot'], ['journal', 'Journal'], ['recovery', 'Recovery']];
const TITLES = {

function LS(id) { if (!S.lists[id]) S.lists[id] = { id, sel: new Set(), anchor: -1, focus: null, order: [], sort: DEF_SORT[id.split(':')[0]] || null, q: '', f: {}, csv: null }; return S.lists[id]; }
const DEF_SORT = { clean: ['size', -1], startup: ['name', 1], programs: ['name', 1], services: ['name', 1], drvinst: ['name', 1], drvupd: ['name', 1], procs: ['mem', -1], large: ['size', -1], dupes: ['group', 1], empty: ['path', 1], journal: ['time', -1], rp: ['seq', -1], quar: ['time', -1], privchk: ['title', 1], events: ['time', -1], downloads: ['date', 1], store: ['name', 1], hotfix: ['date', -1] };

// ======================= UI primitives =======================
function setBusy(text) { S.busy = text; let b = $('#busyBar'); if (!text) { if (b) b.remove(); return; } if (!b) { b = document.createElement('div'); b.id = 'busyBar'; b.className = 'busy'; b.setAttribute('role', 'status'); b.innerHTML = '<i></i><span></span>'; document.body.appendChild(b); } $('span', b).textContent = text; }

function modal({ title, body, items, confirm, cancel = 'Cancel', danger, extra, buttons }) {
  return new Promise(res => {

    <div class="card"><h3>Disk space &amp; restart</h3>${st.disks.map(d => { const p = Math.round(d.free / d.total * 100); return `<div class="row" style="padding:4px 0"><b>${esc(d.path)}</b><span class="grow"></span><span class="pill ${p < 10 ? 'bad' : p < 20 ? 'warn' : 'ok'}">${p}% free</span></div>`; }).join('')}<div class="sub" style="margin-top:6px">${st.pendingReboot ? '<span class="pill warn">A restart is pending</span>' : 'No restart is pending.'}</div></div></div>` : '<div class="card empty">Checking…</div>';
  const tools = [['troubleshoot', 'Windows Troubleshooters'], ['netstatus', 'Network status'], ['eventvwr', 'Event Viewer'], ['reliability', 'Reliability Monitor'], ['resmon', 'Resource Monitor'], ['msinfo', 'System Information'], ['sfc', 'System File Checker'], ['dism', 'DISM repair'], ['chkdsk', 'Check disk']];

  <div class="card" style="margin-bottom:14px"><h3>Recent errors and warnings</h3><div class="toolbar"><label class="muted">Period <select id="evHours" aria-label="Period">${[[1, 'last hour'], [24, 'last 24 hours'], [168, 'last 7 days'], [720, 'last 30 days']].map(([v, l]) => `<option value="${v}" ${o.hours === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>${lvl(1, 'Critical')}${lvl(2, 'Error')}${lvl(3, 'Warning')}${lg('System')}${lg('Application')}<label class="muted"><input type="checkbox" id="evRedact" ${o.redact ? 'checked' : ''}> Hide user and PC names</label><label class="muted"><input type="checkbox" id="evMask" ${o.maskPaths ? 'checked' : ''}> Reduce file paths to names</label><button class="btn pri sm" data-act="evCollect">Collect events</button></div>
  ${T.evWarn ? `<div class="muted" style="margin-bottom:8px">${esc(T.evWarn)}</div>` : ''}${T.events ? `<div class="toolbar">${searchBox(L, 'Search events')}${chips(L, 'lvl', [['all', 'All levels'], ['1', 'Critical'], ['2', 'Error'], ['3', 'Warning']])}${selectBox(L, 'prov', 'Source', uniq(T.events, e => e.provider))}</div>${selBar(L, 'events', '')}${table(L, [{ h: 'Time', s: 'time' }, { h: 'Log', s: 'log' }, { h: 'Level', s: 'level' }, { h: 'Source', s: 'provider' }, { h: 'ID', s: 'id', n: 1 }, { h: 'Message' }], rows, 'No events in this period.')}` : '<div class="muted">Pick a period and press “Collect events”. The logs are read on this PC only.</div>'}</div>

// ---------- Recovery ----------
TOPACT.recovery = () => `<button class="btn ghost" data-act="recRefresh">Refresh</button>`;
PAGES.recovery = () => {
  const R = S.rec, P = LS('rp'), Qm = LS('quar'), bk = S.journal.backups;
  const rp = R.points; let status = 'Checking…', cls = 'neutral';
  if (rp) { if (rp.policyOff) { status = 'Turned off by policy'; cls = 'bad'; } else if (!rp.ok) { status = 'Could not read (needs administrator rights?)'; cls = 'warn'; } else if (!rp.items.length) { status = 'No restore points found — System Protection may be off'; cls = 'warn'; } else { status = `${rp.items.length} restore point${rp.items.length === 1 ? '' : 's'} available`; cls = 'ok'; } }
  const head = `<div class="card" style="margin-bottom:14px"><div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div class="grow"><h3>System Protection</h3><div><span class="pill ${cls}">${esc(status)}</span></div><div class="muted" style="margin-top:6px">Restore points can roll back system changes such as drivers. They are <b>not</b> a backup of your personal files. Feather never deletes restore points.</div></div><button class="btn pri" data-act="rpCreate">Create a restore point</button><button class="btn ghost" data-act="toolId" data-id="sysprot">System Protection settings</button></div></div>`;
  const prows = rp && rp.items ? sortItems(P, rp.items.filter(e => matchQ(P, e.desc + ' ' + e.date)), { seq: e => e.seq, date: e => e.date, desc: e => e.desc }).map(e => ({ k: e.seq, cells: [esc(e.date), esc(e.desc), e.type === 12 ? 'Settings change' : e.type === 0 ? 'Program install' : e.type === 10 ? 'Program uninstall' : e.type === 13 ? 'Driver install' : 'Other'], csv: [e.date, e.desc, e.type] })) : [];
  const q = R.quar; let qlist = q ? q.items.filter(e => matchQ(Qm, e.orig + ' ' + e.source)) : []; qlist = sortItems(Qm, qlist, { time: e => e.time, name: e => e.orig, size: e => e.bytes, source: e => e.source });
  const qrows = qlist.map(e => ({ k: e.id, cells: [`<div class="nm cut" style="max-width:420px" title="${esc(e.orig)}">${esc(e.orig.split('\\').pop())}${e.dir ? ' <span class="pill neutral">folder</span>' : ''}</div><div class="muted cut" style="max-width:420px">${esc(e.orig)}</div>`, fmt(e.bytes), esc(e.source), esc((e.time || '').replace('T', ' ').slice(0, 16))], csv: [e.orig, e.bytes, e.source, e.time] }));
  const qsel = q ? selectedOf(Qm, q.items, e => e.id) : [];
  const bkRows = bk ? bk.slice(0, 40).map((b, k) => `<div class="row"><div class="grow"><div class="nm cut">${esc(b.label)}</div><div class="muted">${esc(b.time)} · ${b.kind === 'registry' ? 'Registry' : 'Startup'}</div></div><button class="btn ghost sm" data-act="restore" data-k="${k}">Restore</button></div>`).join('') || '<div class="muted">No backups yet.</div>' : 'Loading…';
  return head + `<div class="grid split"><div><h3 style="margin:0 0 8px;color:var(--mute);font-size:12px;letter-spacing:.6px;text-transform:uppercase">Quarantine</h3><div class="muted" style="margin-bottom:8px">Leftovers and stray files Feather removed are kept here until you delete them for good. ${q ? fmt(q.total) + ' held.' : ''}</div>
  <div class="toolbar">${searchBox(Qm, 'Search quarantine')}</div>${selBar(Qm, 'items', `<button class="btn pri sm" data-act="quarRestore" ${qsel.length ? '' : 'disabled'}>Restore${qsel.length > 1 ? ' (' + qsel.length + ')' : ''}</button><button class="btn danger sm" data-act="quarPurge" ${qsel.length ? '' : 'disabled'}>Delete permanently…</button>`)}${table(Qm, [{ h: 'Item', s: 'name' }, { h: 'Size', s: 'size', n: 1 }, { h: 'From', s: 'source' }, { h: 'Moved', s: 'time' }], qrows, 'Quarantine is empty.')}</div>
  <div class="card side"><h3>Backups Feather made</h3><div class="muted">Registry and startup entries are exported before they are changed.</div>${bkRows}<button class="btn ghost sm" style="margin-top:10px" data-act="openBackups">Open backup folder</button><div class="evid"><b>Cannot be undone</b>Temporary files and caches that were deleted, services that were deleted and files removed with “Delete permanently” cannot be restored. The Journal says which actions are reversible.</div></div></div>
  <h3 style="margin:18px 0 8px;color:var(--mute);font-size:12px;letter-spacing:.6px;text-transform:uppercase">Windows restore points</h3>${selBar(P, 'restore points', '')}${table(P, [{ h: 'Created', s: 'date' }, { h: 'Description', s: 'desc' }, { h: 'Type' }], prows, rp && !rp.ok ? esc(rp.error || 'Restore points could not be read.') : 'No restore points found.')}`;
};


// ---------- Programs: Store apps + Windows updates tabs ----------
const _progDesktop = PAGES.programs;
PAGES.programs = () => { const t = S.programs.tab, tb = (k, l) => `<button class="chip ${t === k ? 'on' : ''}" data-act="progTab" data-tab="${k}">${l}</button>`; return `<div class="tabs">${tb('desktop', 'Desktop programs')}${tb('store', 'Microsoft Store apps')}${tb('updates', 'Windows updates')}</div>` + (t === 'desktop' ? _progDesktop() : t === 'store' ? storeTab() : hotTab()); };
function storeTab() {
  const P = S.programs, L = LS('store'); if (!P.store) return '<div class="card empty">Reading Store apps… (PowerShell can take a few seconds)</div>'; if (P.storeErr) return `<div class="card empty">${esc(P.storeErr)}</div>`;
  let list = P.store.filter(e => matchQ(L, e.name + ' ' + e.publisher) && (!L.f.kind || L.f.kind === 'all' || (L.f.kind === 'rem' ? e.removable : !e.removable))); list = sortItems(L, list, { name: e => e.name, pub: e => e.publisher, ver: e => e.version });
  const rows = list.map(e => ({ k: e.full, cells: [`<div class="nm">${esc(e.name)}</div><div class="muted cut">${esc(e.full)}</div>`, esc(e.publisher), esc(e.version), e.removable ? '<span class="pill ok">removable</span>' : `<span class="pill neutral">${e.framework ? 'framework' : 'protected'}</span>`], csv: [e.name, e.publisher, e.version, e.full] }));
  const sel = selectedOf(L, P.store, e => e.full), f = P.store.find(e => e.full === L.focus);
  const side = sel.length > 1 ? panelMulti(`${sel.length} apps selected`, [`Removable: ${sel.filter(e => e.removable).length}`, `Protected: ${sel.filter(e => !e.removable).length}`]) : f ? `<h3>Details</h3><h4>${esc(f.name)}</h4><dl class="kv"><dt>Publisher</dt><dd>${esc(f.publisher)}</dd><dt>Version</dt><dd>${esc(f.version)}</dd><dt>Package</dt><dd>${esc(f.full)}</dd><dt>Location</dt><dd>${esc(f.location)}</dd></dl>${f.removable ? '' : '<div class="evid"><b>Protected</b>Windows components, frameworks and non-removable apps cannot be removed here.</div>'}` : '<h3>Details</h3><div class="muted">Select an app. Only apps Windows allows you to remove are offered.</div>';
  return `<div class="toolbar">${searchBox(L, 'Search Store apps')}${chips(L, 'kind', [['all', 'All'], ['rem', 'Removable'], ['prot', 'Protected']])}</div>${selBar(L, 'apps', `<button class="btn danger sm" data-act="storeRemove" ${sel.some(e => e.removable) ? '' : 'disabled'}>Remove…</button>`)}${splitView(table(L, [{ h: 'App', s: 'name' }, { h: 'Publisher', s: 'pub' }, { h: 'Version', s: 'ver' }, { h: 'Status' }], rows, 'No Store apps match.'), side)}`;
}
function hotTab() {
  const P = S.programs, L = LS('hotfix'); if (!P.hot) return '<div class="card empty">Reading installed Windows updates…</div>'; if (P.hotErr) return `<div class="card empty">${esc(P.hotErr)}</div>`;
  let list = P.hot.filter(e => matchQ(L, e.kb + ' ' + e.desc)); list = sortItems(L, list, { kb: e => e.kb, desc: e => e.desc, date: e => { const d = Date.parse(e.date); return isNaN(d) ? 0 : d; } });
  const rows = list.map(e => ({ k: e.kb, cells: [`<div class="nm">${esc(e.kb)}</div>`, esc(e.desc), esc(e.date), esc(e.by)], csv: [e.kb, e.desc, e.date, e.by] })); const sel = selectedOf(L, P.hot, e => e.kb);
  return `<div class="muted" style="margin-bottom:8px">Updates are removed only through Windows’ own supported uninstaller (wusa). Removing security updates can leave the PC exposed.</div><div class="toolbar">${searchBox(L, 'Search updates')}</div>${selBar(L, 'updates', `<button class="btn danger sm" data-act="hotUninstall" ${sel.length === 1 ? '' : 'disabled'}>Uninstall…</button>`)}${table(L, [{ h: 'Update', s: 'kb' }, { h: 'Type', s: 'desc' }, { h: 'Installed', s: 'date' }, { h: 'By' }], rows, 'No updates found.')}`;
}

  <div class="setrow"><div class="grow"><b>License</b><div class="muted">${esc(S.lic ? S.lic.state : 'Checking…')}${S.lic && S.lic.valid ? ' · ' + esc(S.lic.name) : ''}<br>All current features are free. A license is only needed for optional paid features, if and when they are offered.</div></div><button class="btn ghost sm" data-act="licEnter">Enter key…</button>${S.lic && S.lic.valid ? '<button class="btn ghost sm" data-act="licRemove">Remove</button>' : ''}</div>
  <div class="setrow"><div class="grow"><b>Start Feather with Windows</b><div class="muted">Off by default. Adds an entry to your startup list that you can remove here or on the Startup page.</div></div>${sw('startWithWindows', i.startWithWindows)}</div>
  <div class="setrow"><div class="grow"><b>Keep the journal for</b><div class="muted">Older entries are removed when Feather starts. Backups and quarantine are never removed automatically.</div></div><select id="logDays" aria-label="Journal retention">${[[0, 'Forever'], [30, '30 days'], [90, '90 days'], [180, '6 months'], [365, '1 year']].map(([v, l]) => `<option value="${v}" ${+i.logDays === v ? 'selected' : ''}>${l}</option>`).join('')}</select><button class="btn ghost sm" data-act="clearJournal">Clear journal…</button></div>

  <div class="setrow" style="align-items:flex-start"><div class="grow"><b>Ignored findings</b><div class="muted">Hidden from Clean, Startup and Driver updates. Nothing on your PC is changed by ignoring.</div>${(S.ign || []).map(x => `<div class="row"><span class="pill neutral">${esc(x.kind)}</span><span class="grow cut">${esc(x.label)}</span><button class="btn ghost sm" data-act="ignRemove" data-i="${x.i}">Show again</button></div>`).join('') || '<div class="muted">None.</div>'}</div>${(S.ign || []).length ? '<button class="btn ghost sm" data-act="ignClear">Show all again</button>' : ''}</div>
  <div class="setrow"><div class="grow"><b>Large file threshold</b><div class="muted">MB</div></div><input type="number" min="1" id="largeMin" value="${i.largeMinMB}"></div>

  <div class="setrow"><div class="grow"><b>Administrator rights</b><div class="muted">${i.admin ? 'Running as administrator.' : 'Some cleaning, driver and service actions need administrator rights.'}</div></div>${i.admin ? '' : '<button class="btn ghost sm" data-act="admin">Restart as administrator</button>'}</div>

// ======================= data loading =======================
async function loadJournal() { const r = await call('journal.list', { limit: 500 }); S.journal.items = r.ok ? r.items : []; }
async function loadBackups() { const r = await call('backups.list'); S.journal.backups = r.ok ? r.items : []; }
async function loadDrives() { const r = await call('storage.drives'); S.storage.drives = r.ok ? r.items : []; }
async function loadScan() { const r = await call('scan.folders'); if (r.ok) S.scan = r; }
async function loadClean(deep) { const r = await run(deep ? 'Deep scan…' : 'Scanning for junk…', () => call('clean.scan', { deep })); if (!r.ok) return toast(r.error, true); const sc = r.scan; Object.assign(S.clean, { items: sc.items, gen: sc.gen, coverage: sc.coverage, deep, hidden: sc.hidden || 0 }); const L = LS('clean'); L.sel.clear(); L.focus = null; }
async function loadStartup() { const r = await run('Reading startup entries…', () => call('startup.list')); if (r.ok) { loadImpact().then(() => S.page === 'startup' && draw()); S.startup.items = r.items; S.startup.coverage = r.coverage; S.startup.hidden = r.hidden || 0; } else toast(r.error, true); }
async function loadPrograms() { const r = await run('Reading installed programs…', () => call('programs.list')); if (r.ok) S.programs.items = r.items; else toast(r.error, true); }
async function loadServices() { const r = await run('Reading services…', () => call('services.list', { drivers: S.services.drivers })); if (r.ok) S.services.items = r.items; else toast(r.error, true); }
async function loadDrivers() { const r = await run('Reading installed drivers…', () => call('drivers.list')); if (r.ok) { S.drivers.items = r.items; S.drivers.pending = r.pending || 0; } else { S.drivers.items = []; toast(r.error, true); } }
async function loadProcs() { const r = await run('Reading processes…', () => call('processes.list')); if (r.ok) S.procs.items = r.items; else toast(r.error, true); }
async function loadPrivacy() { const [p, c] = await Promise.all([call('privacy.scan'), call('privacy.checklist')]); S.priv.items = p.ok ? p.items : []; S.priv.gen = p.gen || 0; S.priv.sel.clear(); S.priv.checklist = c.ok ? c.items : []; }
async function loadTrouble() { const r = await call('trouble.status'); S.trouble.status = r.ok ? r : { devices: [], services: [], disks: [], pendingReboot: false }; }
async function loadRecovery() { const [p, q, b] = await Promise.all([call('recovery.points'), call('quarantine.list'), call('backups.list')]); S.rec.points = p; S.rec.quar = q.ok ? q : { items: [], total: 0 }; S.journal.backups = b.ok ? b.items : []; }
async function loadSettingsData() { const [e, i] = await Promise.all([call('exclusions.list'), call('ignore.list')]); S.excl = e.ok ? e.items : []; S.ign = i.ok ? i.items : []; }
async function loadStore() { const r = await run('Reading Store apps…', () => call('store.list')); S.programs.storeErr = r.ok ? '' : r.error; S.programs.store = r.ok ? r.items : []; }
async function loadHot() { const r = await run('Reading installed updates…', () => call('hotfix.list')); S.programs.hotErr = r.ok ? '' : r.error; S.programs.hot = r.ok ? r.items : []; }
async function loadDash() { const r = await call('dashboard.info'); if (r.ok) S.dash = r; }
async function loadLic() { const r = await call('license.status'); if (r.ok) S.lic = r; }
async function loadImpact() { const r = await call('startup.impact'); S.startup.impact = {}; S.startup.impactErr = r.error || ''; if (r.ok) for (const x of r.items) S.startup.impact[x.exe] = x; }
async function loadSys() { const r = await call('sys.info'); if (r.ok) S.sys = r; }
async function loadPage() {
  const p = S.page;

  const all = t.closest('input[data-all]'); if (all) { const L = S.lists[all.dataset.all]; L.sel = all.checked ? new Set(L.order) : new Set(); draw(); return; }
  const row = t.closest('tr[data-ix]'); if (row) { if (t.closest('button,a,select')) return; pickRow(S.lists[row.dataset.l], +row.dataset.ix, e, !!t.closest('input[data-chk]')); return; }
  const th = t.closest('th[data-sort]'); if (th) { const L = S.lists[th.dataset.l]; L.sort = [th.dataset.sort, L.sort && L.sort[0] === th.dataset.sort ? -L.sort[1] : 1]; draw(); return; }
  const fc = t.closest('[data-fc]'); if (fc) { const [id, field, val] = fc.dataset.fc.split('|'); LS(id).f[field] = val; draw(); return; }
  const ft = t.closest('[data-ft]'); if (ft) { S.files.mode = ft.dataset.ft; draw(); return; }
  const dt = t.closest('[data-dtab]'); if (dt) { S.drivers.tab = dt.dataset.dtab; draw(); return; }
  const dv = t.closest('[data-drive],[data-path]'); if (dv && S.page === 'storage') { await openFolder(dv.dataset.drive || dv.dataset.path); return; }
});
document.addEventListener('input', e => { const q = e.target.dataset && e.target.dataset.q; if (q) { LS(q).q = e.target.value; draw(); } });
document.addEventListener('change', async e => { const el = e.target, id = el.id;
  if (el.dataset.fs) { const [lid, field] = el.dataset.fs.split('|'); LS(lid).f[field] = el.value; draw(); return; }
  if (el.dataset.fchk) { const [lid, field] = el.dataset.fchk.split('|'); LS(lid).f[field] = field === 'admin' ? (el.checked ? 'no' : '') : el.checked; draw(); return; }
  if (el.dataset.pcat) { el.checked ? S.priv.sel.add(el.dataset.pcat) : S.priv.sel.delete(el.dataset.pcat); draw(); return; }
  if (el.dataset.evlevel) { const n = +el.dataset.evlevel, a = S.trouble.opts.levels; el.checked ? (a.includes(n) || a.push(n)) : a.splice(a.indexOf(n), 1); return; }
  if (el.dataset.evlog) { const n = el.dataset.evlog, a = S.trouble.opts.logs; el.checked ? (a.includes(n) || a.push(n)) : a.splice(a.indexOf(n), 1); return; }
  if (id === 'dlDays') { S.files.days = +el.value; return; }
  if (id === 'evHours') { S.trouble.opts.hours = +el.value; return; } if (id === 'evRedact') { S.trouble.opts.redact = el.checked; return; } if (id === 'evMask') { S.trouble.opts.maskPaths = el.checked; return; }
  if (id === 'drv') { S.services.drivers = el.checked; S.services.items = null; draw(); await loadServices(); draw(); }
  else if (id === 'stypeBatch' && el.value) { const L = LS('services'), sel = selectedOf(L, S.services.items, x => x.name), type = el.value, lbl = el.options[el.selectedIndex].text; el.value = '';
    if (sel.length && !await adminGate(sel, 'change service start types')) return;
    if (!sel.length || !await modal({ title: `Set start type to ${lbl}?`, body: 'Critical services are skipped. This is recorded in the Journal and can be reversed.', items: sel.map(x => `${x.display} (now ${x.start})`), confirm: 'Apply' })) return;
    let ok = 0, bad = 0, first = ''; for (const x of sel) { const r = await run(`${x.display}…`, () => call('services.startType', { name: x.name, type })); if (r.ok) ok++; else { bad++; first = first || `${x.display}: ${r.error}`; } }
    toast(`${ok} changed${bad ? ', ' + bad + ' skipped/failed: ' + first : ''}`, bad > 0); await loadServices(); loadJournal(); draw(); }
  else if (id === 'logDays') { await call('app.set', { key: 'logDays', value: +el.value }); S.info.logDays = +el.value; toast(+el.value ? `Journal entries older than ${el.options[el.selectedIndex].text} will be removed when Feather starts.` : 'The journal is kept forever.'); }
  else if (id === 'largeMin') { await call('app.set', { key: 'largeMinMB', value: +el.value }); S.info.largeMinMB = +el.value; }
  else if (id === 'dupMin') { await call('app.set', { key: 'dupMinKB', value: +el.value }); S.info.dupMinKB = +el.value; } });
document.addEventListener('keydown', e => {
  if ($('#layer').children.length) return; const tg = e.target, typing = tg && /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName) && tg.type !== 'checkbox';
  if (e.key === '/' && !typing) { const q = document.querySelector('input[data-q]'); if (q) { e.preventDefault(); q.focus(); } return; }
  if (typing) return; const L = activeList(); if (!L || !L.order.length) return; const ix = L.focus == null ? -1 : L.order.indexOf(L.focus);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); L.sel = new Set(L.order); draw(); }
  else if (e.key === 'Escape') { L.sel.clear(); draw(); }
  else if (e.key === ' ' && ix >= 0) { e.preventDefault(); L.sel.has(L.focus) ? L.sel.delete(L.focus) : L.sel.add(L.focus); L.anchor = ix; draw(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = Math.max(0, Math.min(L.order.length - 1, ix + (e.key === 'ArrowDown' ? 1 : -1))); if (e.shiftKey) { if (L.anchor < 0) L.anchor = ix < 0 ? n : ix; const [a, b] = [L.anchor, n].sort((x, y) => x - y); L.sel = new Set(L.order.slice(a, b + 1)); } else { L.sel = new Set([L.order[n]]); L.anchor = n; } L.focus = L.order[n]; S.scrollFocus = true; draw(); }
  else if (e.key === 'Delete' && L.sel.size) { const act = { startup: 'suDelete', procs: 'procEnd' }[S.page]; if (S.page === 'files') A.fileRemove({ dataset: { v: e.shiftKey ? '1' : '0' } }); else if (act) A[act](); }
});
on('goto', d => { const m = { speed: 'startup', toolbox: 'tools', large: 'files', dupes: 'files', empty: 'files', history: 'journal' }; if (['large', 'dupes', 'empty'].includes(d.page)) S.files.mode = d.page; go(m[d.page] || d.page); });

// ======================= boot =======================
(async function () {
  draw(); const r = await call('app.info'); if (r.ok) S.info = r; draw(); loadPage(); loadDash().then(draw);
  if (S.info.onlineAdvice) call('advice.refresh').then(a => { if (a.ok) { S.info.adviceVersion = a.version; S.info.adviceSource = a.source; if (a.source === 'downloaded') { S.startup.items = null; S.services.items = null; if (S.page === 'startup' || S.page === 'services') loadPage(); } } });
  if (S.info.autoUpdate) { const u = await call('update.check', { launch: true }); if (u.ok) { S.update = u; draw(); if (u.newer && !u.suppressed) promptUpdate(u); } }
})();
</script></body></html>
