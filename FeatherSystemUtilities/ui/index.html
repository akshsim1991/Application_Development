<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Feather System Utilities</title>
<style>
:root{--ink:#14213d;--ink2:#4a5775;--mute:#7b869f;--paper:#f6f3ec;--card:#fff;--line:#e6e1d4;--line2:#f0ecdf;--teal:#0f9d8a;--teal2:#0b7a6b;--coral:#ef6f55;--amber:#e8a21c;--indigo:#3b4bd8;--soft:#f7f5ee;--rail:#14213d;--shadow:0 1px 2px rgba(20,33,61,.06),0 8px 24px rgba(20,33,61,.06);--okbg:#dff5ef;--okfg:#0b7a6b;--warnbg:#fdf0d5;--warnfg:#8a5d00;--badbg:#fde3dd;--badfg:#b4412b;--infobg:#e4e7fb;--infofg:#2c38b5;--hover:#faf8f2;--focus:#3b4bd8}
@media (prefers-color-scheme:dark){:root{--ink:#e8ecf7;--ink2:#b3bdd6;--mute:#8a96b3;--paper:#0f1626;--card:#18213a;--line:#2a3556;--line2:#222c49;--soft:#1e2846;--rail:#0a101e;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);--okbg:#12403a;--okfg:#5fe0c8;--warnbg:#4a3a10;--warnfg:#f3c25b;--badbg:#4b221b;--badfg:#ff9b86;--infobg:#242c5f;--infofg:#a9b4ff;--hover:#1c2745}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:14px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:88px 1fr;height:100vh}
.rail{background:var(--rail);color:#cfd6ea;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:1px;overflow:auto}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#19c3a8,#3b4bd8);display:grid;place-items:center;margin-bottom:8px;flex:none}
.nav{width:72px;padding:6px 0 4px;border-radius:14px;text-align:center;font-size:11px;color:#9fb0d4;cursor:pointer;border:0;background:none;flex:none}
.nav svg{display:block;width:22px;height:22px;margin:0 auto 4px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav:hover{background:#1a2a52;color:#fff}.nav.on{background:#223a74;color:#fff}.nav.on svg{stroke:#38e0c5}
.rail .sp{flex:1}
.main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:14px;padding:16px 28px 10px;flex:none}
.title h1{margin:0;font-size:22px;letter-spacing:-.2px}.title span{color:var(--mute);font-size:12.5px}
.top .grow{flex:1}
.banner{margin:0 28px 10px;padding:10px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;background:var(--infobg);color:var(--infofg);font-weight:600}
.banner.warn{background:var(--warnbg);color:var(--warnfg)}.banner button{margin-left:auto}
.view{flex:1;overflow:auto;padding:4px 28px 28px;user-select:text}
.btn{border:0;border-radius:11px;padding:9px 16px;font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
.btn[disabled]{opacity:.45;cursor:default}
.pri{background:linear-gradient(180deg,#14b39d,#0b8f7d);color:#fff;box-shadow:0 6px 16px rgba(15,157,138,.28)}
.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}.ghost:hover:not([disabled]){background:var(--hover)}
.danger{background:var(--badbg);color:var(--badfg)}
.sm{padding:6px 12px;font-size:12.5px;border-radius:9px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.split{grid-template-columns:minmax(0,1fr) 340px}
@media (max-width:1180px){.g3{grid-template-columns:1fr 1fr}.split{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line2);min-width:0}
.card h3{margin:0 0 6px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--mute)}
.big{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.15}.sub{color:var(--ink2)}.muted{color:var(--mute);font-size:12.5px}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ok{background:var(--okbg);color:var(--okfg)}.warn{background:var(--warnbg);color:var(--warnfg)}.bad{background:var(--badbg);color:var(--badfg)}.info{background:var(--infobg);color:var(--infofg)}.neutral{background:var(--soft);color:var(--ink2)}
.hero{background:linear-gradient(120deg,#14213d 0%,#23397a 60%,#2b6cb0 100%);color:#fff;border:0;display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;margin-bottom:16px;padding:22px 26px}
.hero h2{margin:0 0 6px;font-size:23px;letter-spacing:-.3px}.hero p{margin:0;color:#c8d3f0;max-width:560px}.hero .btn{background:#fff;color:#14213d}
.bar{height:8px;border-radius:6px;background:var(--line);overflow:hidden}.bar b{display:block;height:100%;background:linear-gradient(90deg,#14b39d,#3b4bd8)}.bar.hot b{background:linear-gradient(90deg,#e8a21c,#ef6f55)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2)}.row:first-child{border-top:0}.row .grow,.grow{flex:1;min-width:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:7px 12px;min-width:240px}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer}.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tablewrap{overflow:auto;border-radius:14px;max-height:calc(100vh - 290px);border:1px solid var(--line2)}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{position:sticky;top:0;background:var(--card);text-align:left;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);padding:9px 10px;cursor:pointer;white-space:nowrap;z-index:1;border-bottom:1px solid var(--line)}
td{padding:9px 10px;border-top:1px solid var(--line2);vertical-align:middle}tr.r{cursor:pointer}tr.r:hover td{background:var(--hover)}tr.sel td{background:var(--infobg)}
td.num,th.num{text-align:right;white-space:nowrap}.nm{font-weight:600;overflow:hidden;text-overflow:ellipsis}.cut{max-width:380px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--teal);cursor:pointer}
.sw{position:relative;width:38px;height:22px;border-radius:99px;background:#c9c3b2;border:0;cursor:pointer;flex:none;padding:0}.sw:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}.sw.on{background:var(--teal)}.sw.on:after{left:19px}.sw[disabled]{opacity:.4;cursor:default}
.side h4{margin:0 0 4px;font-size:16px;word-break:break-word}.evid{background:var(--soft);border-radius:12px;padding:11px 13px;margin:9px 0;font-size:13px;white-space:pre-wrap;word-break:break-word}.evid b{display:block;font-size:11.5px;letter-spacing:.5px;text-transform:uppercase;color:var(--mute);margin-bottom:3px}
.empty{padding:36px;text-align:center;color:var(--mute)}
.tl{position:relative;margin-left:8px;padding-left:20px;border-left:2px solid var(--line)}.tl .ev{position:relative;padding:7px 0}.tl .ev:before{content:"";position:absolute;left:-27px;top:12px;width:12px;height:12px;border-radius:50%;background:var(--card);border:3px solid var(--teal)}.tl .ev.c:before{border-color:var(--coral)}.tl .ev.a:before{border-color:var(--amber)}
.tm{position:relative;height:430px;border-radius:14px;overflow:hidden;background:var(--soft)}.tm .c{position:absolute;border:2px solid var(--card);border-radius:8px;padding:7px 9px;color:#fff;font-size:12px;font-weight:600;overflow:hidden;cursor:pointer;line-height:1.25}.tm .c small{display:block;font-weight:500;opacity:.9}.tm .c:hover{filter:brightness(1.1)}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px;color:var(--mute)}.crumbs a{color:var(--indigo);cursor:pointer;font-weight:600}
.shade{position:fixed;inset:0;background:rgba(10,16,30,.5);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:var(--card);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:min(640px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
.modal header{padding:20px 24px 6px}.modal header h2{margin:0;font-size:19px}.modal .body{padding:6px 24px;overflow:auto;user-select:text}.modal footer{padding:14px 24px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.modal ul{margin:8px 0;padding:0;list-style:none}.modal li{padding:6px 10px;border-radius:9px;background:var(--soft);margin-bottom:4px;font-size:13px;word-break:break-all}
.busy{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 20px;border-radius:99px;z-index:60;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:80vw}
.busy i{width:14px;height:14px;border-radius:50%;border:3px solid currentColor;border-right-color:transparent;animation:sp .8s linear infinite;flex:none}@keyframes sp{to{transform:rotate(360deg)}}
.busy span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;right:24px;top:20px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--teal);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);z-index:70;max-width:420px}.toast.err{border-left-color:var(--coral)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px}.kv dt{color:var(--mute)}.kv dd{margin:0;word-break:break-word}
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-top:1px solid var(--line2)}.setrow:first-of-type{border-top:0}
input[type=number]{width:110px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12.5px}.dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:6px}
th.sorted{color:var(--ink)}th .arr{font-size:9px;margin-left:3px}
tr.r{user-select:none}tr.sel td{background:var(--infobg)}tr.fc td:first-child{box-shadow:inset 3px 0 0 var(--teal)}
.selbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--infobg);color:var(--infofg);border-radius:11px;margin-bottom:10px;font-weight:600;flex-wrap:wrap}.selbar a{cursor:pointer;text-decoration:underline;font-weight:500}
select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;max-width:190px}
.menu{position:fixed;left:84px;bottom:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:40;min-width:230px}.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;cursor:pointer}.menu button:hover{background:var(--hover)}
kbd{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:12px}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.tool{border:1px solid var(--line2);border-radius:14px;padding:14px;background:var(--card)}.tool b{display:block}.tool .muted{margin:4px 0 10px}
</style></head>
<body>
<div class="app">
<nav class="rail" id="rail" aria-label="Main"></nav>
<div class="main"><div class="top"><div class="title"><h1 id="ttl"></h1><span id="sub"></span></div><div class="grow"></div><div id="topact"></div></div><div id="ban"></div><main class="view" id="view"></main></div>
</div>
<div id="layer"></div>
<script>
"use strict";
// ======================= bridge =======================
const wv = window.chrome && window.chrome.webview;
let nextId = 1; const pending = new Map(); const listeners = {};
function call(cmd, args) { return new Promise(res => { const id = nextId++; pending.set(id, res); if (!wv) { res({ ok: false, error: 'Not running inside Feather System Utilities.' }); return; } wv.postMessage({ id, cmd, args: args || {} }); }); }
if (wv) wv.addEventListener('message', e => { const m = e.data; if (m && m.id != null) { const r = pending.get(m.id); if (r) { pending.delete(m.id); r(m.data); } } else if (m && m.event) (listeners[m.event] || []).forEach(f => f(m.data)); });
const on = (ev, f) => { (listeners[ev] = listeners[ev] || []).push(f); };

// ======================= helpers =======================
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function fmt(b) { b = +b || 0; const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1024 && i < 4) { b /= 1024; i++; } return (i === 0 ? b.toFixed(0) : b.toFixed(b >= 100 ? 0 : 1)) + ' ' + u[i]; }
const risk = r => r === 0 ? '<span class="pill ok">Low risk</span>' : r === 1 ? '<span class="pill warn">Medium</span>' : '<span class="pill bad">High</span>';
const icon = d => `<svg viewBox="0 0 24 24">${d}</svg>`;
const ICON = {
  today: icon('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
  clean: icon('<path d="M4 20l9-9M13 4l7 7M10 7l7 7-6 6-7-7z"/>'),
  programs: icon('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M17.5 14v7M14 17.5h7"/>'),
  startup: icon('<path d="M12 3v9M6.3 7.3a8 8 0 1 0 11.4 0"/>'),
  services: icon('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  drivers: icon('<rect x="4" y="6" width="16" height="12" rx="2"/><path d="M8 18v3M16 18v3M8 3v3M16 3v3M9 12h6"/>'),
  procs: icon('<path d="M3 12h4l3-8 4 16 3-8h4"/>'),
  files: icon('<path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>'),
  storage: icon('<ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6"/>'),
  tools: icon('<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.6 2.6-2.4-.6-.6-2.4z"/>'),
  journal: icon('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  settings: icon('<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>'),
  about: icon('<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/>')
};
const NAV = [['today', 'Today'], ['clean', 'Clean'], ['programs', 'Programs'], ['startup', 'Startup'], ['services', 'Services'], ['drivers', 'Drivers'], ['procs', 'Processes'], ['files', 'Files'], ['storage', 'Storage'], ['tools', 'Tools'], ['journal', 'Journal']];
const TITLES = {
  today: ['', 'Nothing is changed without your OK · everything is previewed and can be rolled back'],
  clean: ['Clean', 'Review what can be removed. Each item says why it is safe, and what happens.'],
  programs: ['Programs', 'Uninstall silently or step by step. Leftovers are previewed, never guessed.'],
  startup: ['Startup', 'What runs when you sign in, with the evidence behind every entry.'],
  services: ['Services', 'Windows services. Critical ones are protected.'],
  drivers: ['Drivers', 'See what is installed and check Windows Update for newer drivers.'],
  procs: ['Processes', 'What is running right now. Critical Windows processes are protected.'],
  files: ['Files', 'Large files, duplicates (proven identical byte-for-byte) and empty folders.'],
  storage: ['Storage', 'See where your space went. Click a block to drill down.'],
  tools: ['Tools', 'System information and Windows’ own repair tools, one click away.'],
  journal: ['Journal & rollback', 'Everything Feather changed, and the backups you can restore.'],
  settings: ['Settings', 'Feather works offline. Updates are the only network feature, and optional.']
};

// ======================= state =======================
const S = { page: 'today', info: {}, today: { ran: false, running: false }, lists: {},
  clean: { items: null, gen: 0, coverage: '', deep: false }, startup: { items: null, coverage: '' }, programs: { items: null }, services: { items: null, drivers: false },
  drivers: { tab: 'installed', items: null, upd: null, updErr: '' }, procs: { items: null }, files: { mode: 'large', data: {} }, storage: { drives: null, data: null }, sys: null, scan: null,
  journal: { items: null, backups: null }, update: null, busy: null };
function LS(id) { if (!S.lists[id]) S.lists[id] = { id, sel: new Set(), anchor: -1, focus: null, order: [], sort: DEF_SORT[id.split(':')[0]] || null, q: '', f: {}, csv: null }; return S.lists[id]; }
const DEF_SORT = { clean: ['size', -1], startup: ['name', 1], programs: ['name', 1], services: ['name', 1], drvinst: ['name', 1], drvupd: ['name', 1], procs: ['mem', -1], large: ['size', -1], dupes: ['group', 1], empty: ['path', 1], journal: ['time', -1] };

// ======================= UI primitives =======================
function setBusy(text) { S.busy = text; let b = $('#busyBar'); if (!text) { if (b) b.remove(); return; } if (!b) { b = document.createElement('div'); b.id = 'busyBar'; b.className = 'busy'; b.setAttribute('role', 'status'); b.innerHTML = '<i></i><span></span>'; document.body.appendChild(b); } $('span', b).textContent = text; }
on('progress', d => { if (S.busy) setBusy(d.text); });
let toastT; function toast(msg, err) { const old = $('.toast'); if (old) old.remove(); const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.setAttribute('role', 'alert'); t.textContent = msg; document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(() => t.remove(), err ? 9000 : 4500); }
function modal({ title, body, items, confirm, cancel = 'Cancel', danger, extra, buttons }) {
  return new Promise(res => {
    const el = document.createElement('div'); el.className = 'shade';
    const btns = buttons || [].concat(cancel ? [{ label: cancel, value: false, ghost: true }] : [], confirm ? [{ label: confirm, value: true, danger }] : []);
    el.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header><h2>${esc(title)}</h2></header><div class="body">${body ? `<p>${body}</p>` : ''}${items && items.length ? `<ul>${items.slice(0, 60).map(i => `<li>${esc(i)}</li>`).join('')}${items.length > 60 ? `<li>… and ${items.length - 60} more</li>` : ''}</ul>` : ''}${extra || ''}</div><footer>${btns.map((b, k) => `<button class="btn ${b.ghost ? 'ghost' : b.danger ? 'danger' : 'pri'}" data-r="${k}">${esc(b.label)}</button>`).join('')}</footer></div>`;
    const done = v => { document.removeEventListener('keydown', key, true); modal.vals = Object.fromEntries([...el.querySelectorAll('input[id]')].map(i => [i.id, i.type === 'checkbox' ? i.checked : i.value])); el.remove(); res(v); };
    const key = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } }; document.addEventListener('keydown', key, true);
    el.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) done(btns[+b.dataset.r].value); else if (e.target === el) done(false); });
    $('#layer').appendChild(el); const f = $('[data-r]', el); if (f) f.focus();
  });
}
const note = (title, body, items) => modal({ title, body, items, cancel: '', confirm: 'OK' });
async function run(text, fn) { setBusy(text); try { return await fn(); } finally { setBusy(null); } }
const plural = (n, a, b) => `${n} ${n === 1 ? a : b}`;

// ======================= list framework: checkbox + click + Ctrl/Shift multi-select, sort, filter =======================
function cmp(x, y) { return typeof x === 'number' && typeof y === 'number' ? x - y : String(x == null ? '' : x).localeCompare(String(y == null ? '' : y), undefined, { sensitivity: 'base', numeric: true }); }
function sortItems(L, items, getters) { const s = L.sort; if (!s || !getters[s[0]]) return items; const g = getters[s[0]]; return items.slice().sort((a, b) => cmp(g(a), g(b)) * s[1]); }
function matchQ(L, text) { return !L.q || text.toLowerCase().includes(L.q.toLowerCase()); }
// rows: [{k, cells:[html...], csv:[...]}]; cols: [{h, s, n}]
function table(L, cols, rows, empty) {
  L.order = rows.map(r => r.k); const have = new Set(L.order); for (const k of [...L.sel]) if (!have.has(k)) L.sel.delete(k); if (L.focus != null && !have.has(L.focus)) L.focus = null;
  L.csv = { cols: cols.map(c => c.h).filter(Boolean), rows: rows.map(r => ({ k: r.k, v: r.csv || [] })) };
  if (!rows.length) return `<div class="card empty">${empty}</div>`;
  const all = L.sel.size === rows.length, some = L.sel.size > 0 && !all;
  return `<div class="tablewrap"><table><thead><tr><th style="width:34px"><input type="checkbox" data-all="${esc(L.id)}" ${all ? 'checked' : ''} ${some ? 'data-ind="1"' : ''} aria-label="Select all"></th>${cols.map(c => { const on = L.sort && c.s && L.sort[0] === c.s; return `<th class="${c.n ? 'num' : ''} ${on ? 'sorted' : ''}" ${c.s ? `data-sort="${c.s}" data-l="${esc(L.id)}" title="Sort by ${esc(c.h)}"` : ''}>${c.h}${on ? `<span class="arr">${L.sort[1] > 0 ? '▲' : '▼'}</span>` : ''}</th>`; }).join('')}</tr></thead><tbody>${rows.map((r, ix) => `<tr class="r ${L.sel.has(r.k) ? 'sel' : ''} ${L.focus === r.k ? 'fc' : ''}" data-l="${esc(L.id)}" data-ix="${ix}"><td><input type="checkbox" data-chk="1" ${L.sel.has(r.k) ? 'checked' : ''} aria-label="Select row"></td>${r.cells.map((c, i) => `<td class="${cols[i] && cols[i].n ? 'num' : ''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function selBar(L, noun, extraBtns) {

}
const searchBox = (L, ph) => `<label class="search">&#9906;<input id="q-${esc(L.id)}" data-q="${esc(L.id)}" value="${esc(L.q)}" placeholder="${esc(ph)}" aria-label="${esc(ph)}"></label>`;
const chips = (L, field, opts, def = 'all') => `<div class="chips" role="group">${opts.map(([v, l, n]) => `<button class="chip ${(L.f[field] || def) === v ? 'on' : ''}" data-fc="${esc(L.id)}|${field}|${esc(v)}">${esc(l)}${n != null ? ' ' + n : ''}</button>`).join('')}</div>`;
const selectBox = (L, field, label, opts) => `<select data-fs="${esc(L.id)}|${field}" aria-label="${esc(label)}"><option value="">${esc(label)}: all</option>${opts.map(o => `<option value="${esc(o)}" ${L.f[field] === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
const uniq = (arr, f) => [...new Set(arr.map(f).filter(Boolean))].sort((a, b) => a.localeCompare(b));
const selectedOf = (L, items, keyOf) => items.filter(i => L.sel.has(keyOf(i)));
function pickRow(L, ix, e, isChk) {
  const k = L.order[ix]; if (k === undefined) return;
  if (e.shiftKey && L.anchor >= 0) { const [a, b] = [L.anchor, ix].sort((x, y) => x - y); if (!(e.ctrlKey || e.metaKey)) L.sel.clear(); for (let i = a; i <= b; i++) L.sel.add(L.order[i]); }
  else if (isChk || e.ctrlKey || e.metaKey) { L.sel.has(k) ? L.sel.delete(k) : L.sel.add(k); L.anchor = ix; }
  else { L.sel = new Set([k]); L.anchor = ix; }
  L.focus = k; draw();
}
const Q = { text: s => (s || '').toString() };
const panelMulti = (title, lines) => `<h3>${esc(title)}</h3><div class="evid"><b>Selection</b>${lines.map(esc).join('\n')}</div>`;

// ======================= rendering core =======================
function go(page) { S.page = page; draw(); loadPage(); }
function drawRail() { $('#rail').innerHTML = `<div class="logo"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M20 4C10 4 5 9 5 16l-1 4M5 16c6 0 10-4 12-9M9 13c3 0 6-2 8-5"/></svg></div>` +
  NAV.map(([k, l]) => `<button class="nav ${S.page === k ? 'on' : ''}" data-go="${k}" aria-label="${l}">${ICON[k]}${l}</button>`).join('') + `<span class="sp"></span><button class="nav" data-act="aboutMenu" aria-label="About">${ICON.about}About</button><button class="nav ${S.page === 'settings' ? 'on' : ''}" data-go="settings" aria-label="Settings">${ICON.settings}Settings</button>`; }
function greet() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }
function draw() {
  const ae = document.activeElement, keep = ae && ae.id && /^q-/.test(ae.id) ? [ae.id, ae.selectionStart] : null, scroll = $('.tablewrap') ? $('.tablewrap').scrollTop : 0;
  drawRail(); const t = TITLES[S.page]; $('#ttl').textContent = S.page === 'today' ? greet() : t[0]; $('#sub').textContent = t[1];
  $('#ban').innerHTML = S.update && S.update.newer ? `<div class="banner" role="status">Version ${esc(S.update.version)} is available.<button class="btn pri sm" data-act="updInstall">Update now</button></div>` : '';
  const v = $('#view'); const top = v.scrollTop; v.innerHTML = PAGES[S.page](); $('#topact').innerHTML = TOPACT[S.page] ? TOPACT[S.page]() : ''; v.scrollTop = top; if ($('.tablewrap')) $('.tablewrap').scrollTop = scroll;
  document.querySelectorAll('input[data-ind]').forEach(i => i.indeterminate = true);
  if (keep) { const e = document.getElementById(keep[0]); if (e) { e.focus(); try { e.setSelectionRange(keep[1], keep[1]); } catch (_) { } } }
  const fr = $('tr.fc'); if (fr && S.scrollFocus) { fr.scrollIntoView({ block: 'nearest' }); S.scrollFocus = false; }
}
const PAGES = {}, TOPACT = {};
const sideCard = html => `<div class="card side">${html}</div>`;
const splitView = (main, side) => `<div class="grid split"><div style="min-width:0">${main}</div>${sideCard(side)}</div>`;

// ---------- Today ----------
TOPACT.today = () => `<button class="btn pri" data-act="fullCheck" ${S.today.running ? 'disabled' : ''}>${S.today.running ? 'Checking…' : 'Run full check'}</button>`;
PAGES.today = () => {
  const T = S.today, cl = S.clean.items, su = S.startup.items, pg = S.programs.items;
  const safe = cl ? cl.filter(i => i.risk === 0).reduce((a, i) => a + i.bytes, 0) : 0, all = cl ? cl.reduce((a, i) => a + i.bytes, 0) : 0;
  const missing = su ? su.filter(e => e.missing && e.canDelete).length : 0, recent = su ? su.filter(e => e.recent).length : 0, warn = su ? su.filter(e => e.warnings && !e.microsoft).length : 0, on_ = su ? su.filter(e => e.state === 'Enabled' && !e.microsoft).length : 0;
  const finds = [safe > 0 && `${fmt(safe)} of safe-to-remove files`, missing && `${missing} startup entr${missing === 1 ? 'y' : 'ies'} pointing to missing files`, recent && `${recent} recently added startup item${recent === 1 ? '' : 's'}`].filter(Boolean);
  const hero = !T.ran ? `<div><h2>Let’s see how your PC is doing</h2><p>A full check looks at junk files, startup items and installed programs. It only reads — nothing is changed or deleted until you review it.</p></div><button class="btn" data-act="fullCheck" ${T.running ? 'disabled' : ''}>${T.running ? 'Checking…' : 'Run full check'}</button>` :
    `<div><h2>${finds.length ? `${finds.length} thing${finds.length === 1 ? '' : 's'} worth your attention` : 'Everything looks tidy'}</h2><p>${finds.length ? esc(finds.join(' · ')) + '. Every finding comes with the evidence behind it.' : 'No junk or suspicious startup entries were found.'}</p></div><button class="btn" data-go="${safe > 0 ? 'clean' : 'startup'}">Review findings</button>`;
  const drives = S.storage.drives || [];
  return `<div class="card hero">${hero}</div>
  <div class="grid g3">
   <div class="card"><h3>Reclaimable space</h3><div class="big">${cl ? fmt(safe) : '—'}</div><div class="sub">${cl ? `Low-risk files. ${fmt(all - safe)} more needs your review.` : 'Run a check to measure it.'}</div></div>
   <div class="card"><h3>Startup</h3><div class="big">${su ? on_ : '—'}</div><div class="sub">${su ? `non-Microsoft items start with Windows. ${warn} with warnings, ${recent} new.` : 'Run a check to list them.'}</div></div>
   <div class="card"><h3>Programs</h3><div class="big">${pg ? pg.length : '—'}</div><div class="sub">${pg ? `installed. ${fmt(pg.reduce((a, p) => a + p.size, 0))} reported by their installers.` : 'Run a check to list them.'}</div></div>
  </div>
  <div class="grid split" style="margin-top:16px">
   <div class="card"><h3>What changed on this PC</h3>${journalList(6)}<button class="btn ghost sm" style="margin-top:8px" data-go="journal">Open journal</button></div>
   <div class="card"><h3>Drives</h3>${drives.length ? drives.map(d => { const used = d.total - d.free, pct = Math.round(used / d.total * 100); return `<div class="row" style="display:block"><div style="display:flex"><b class="grow">${esc(d.path)}</b><span class="muted">${fmt(d.free)} free of ${fmt(d.total)}</span></div><div class="bar ${pct > 90 ? 'hot' : ''}" style="margin-top:6px"><b style="width:${pct}%"></b></div></div>`; }).join('') : '<div class="muted">Loading…</div>'}<button class="btn ghost sm" style="margin-top:8px" data-go="storage">Explore storage</button></div>
  </div>`;
};
function journalList(n) { const j = S.journal.items; if (!j) return '<div class="muted">Loading…</div>'; if (!j.length) return '<div class="muted">Nothing has been changed by Feather yet.</div>';
  return `<div class="tl">${j.slice(0, n).map(e => `<div class="ev ${/fail|block/i.test(e.result) ? 'c' : e.reversible ? '' : 'a'}"><b>${esc(e.target)}</b><div class="muted">${esc((e.time || '').replace('T', ' ').slice(0, 16))} · ${esc(e.after || e.source)} · ${esc(e.result)}</div></div>`).join('')}</div>`; }

// ---------- Clean ----------
const cleanSelBytes = () => { const L = LS('clean'); return [...L.sel].reduce((a, i) => a + (S.clean.items[i] ? S.clean.items[i].bytes : 0), 0); };
TOPACT.clean = () => { const L = LS('clean'); return `<button class="btn ghost" data-act="cleanScan">Rescan</button> <button class="btn ghost" data-act="deepScan" title="Also search all drives for stray junk and developer caches">Deep scan</button> <button class="btn pri" data-act="cleanRun" ${L.sel.size ? '' : 'disabled'}>Clean ${L.sel.size ? fmt(cleanSelBytes()) : ''}</button>`; };

  const c = S.clean, L = LS('clean'); if (!c.items) return '<div class="card empty">Scanning…</div>';
  let list = c.items.filter(i => matchQ(L, i.name + ' ' + i.detail + ' ' + i.type) && (!L.f.risk || L.f.risk === 'all' || String(i.risk) === L.f.risk) && (!L.f.cat || i.type === L.f.cat) && (L.f.admin !== 'no' || !i.admin));
  list = sortItems(L, list, { name: i => i.name, type: i => i.type, size: i => i.bytes, risk: i => i.risk });
  const rows = list.map(i => ({ k: i.i, cells: [`<div class="nm">${esc(i.name)}</div><div class="muted cut">${esc(i.detail)}</div>`, esc(i.type), i.bytes ? fmt(i.bytes) : (i.kind === 2 || i.kind === 3 ? '1 entry' : ''), risk(i.risk) + (i.admin ? ' <span class="pill neutral" title="Needs administrator rights">admin</span>' : '')], csv: [i.name, i.type, i.bytes, ['Low', 'Medium', 'High'][i.risk]] }));

// ---------- Programs ----------

// ---------- Startup ----------
TOPACT.startup = () => `<button class="btn ghost" data-act="startupRefresh">Refresh</button> <button class="btn ghost" data-act="startupAdd">Add entry…</button>`;

  const side = n > 1 ? panelMulti(`${n} entries selected`, [`Enabled: ${sel.filter(e => e.state === 'Enabled').length} · Disabled: ${sel.filter(e => e.state === 'Disabled').length}`, `Missing file: ${sel.filter(e => e.missing).length} · Warnings: ${sel.filter(e => e.warnings).length}`, `Can be deleted: ${sel.filter(e => e.canDelete).length} · can start later: ${sel.filter(e => e.canDelay).length}`]) + '<div class="evid"><b>Undo</b>Disabling is reversible. Deleting backs entries up first (Journal → Restore); startup shortcuts go to the Recycle Bin.</div>' :

};

// ---------- Services ----------
TOPACT.services = () => `<button class="btn ghost" data-act="svcRefresh">Refresh</button>`;
PAGES.services = () => {
  const v = S.services, L = LS('services'); if (!v.items) return '<div class="card empty">Reading services…</div>';
  const fl = { running: e => e.running, stopped: e => e.stopped, auto: e => /^Automatic/.test(e.start), disabled: e => e.start === 'Disabled', thirdparty: e => !/Microsoft/.test(e.publisher), critical: e => e.critical };
  const startKinds = uniq(v.items, e => e.start), safeKinds = uniq(v.items, e => e.safety);

const TMC = ['#3b4bd8', '#0f9d8a', '#ef6f55', '#e8a21c', '#7a56d6', '#2b8ac6', '#c2477a', '#5b8c3a', '#8a6d3b', '#4a6a8a'];
function squarify(items, W, H) {

    if (w >= h) { x += thick; w -= thick; } else { y += thick; h -= thick; } rest = rest.slice(i); }

}

// ======================= data loading =======================
async function loadJournal() { const r = await call('journal.list', { limit: 500 }); S.journal.items = r.ok ? r.items : []; }
async function loadBackups() { const r = await call('backups.list'); S.journal.backups = r.ok ? r.items : []; }
async function loadDrives() { const r = await call('storage.drives'); S.storage.drives = r.ok ? r.items : []; }
async function loadScan() { const r = await call('scan.folders'); if (r.ok) S.scan = r; }
async function loadClean(deep) { const r = await run(deep ? 'Deep scan…' : 'Scanning for junk…', () => call('clean.scan', { deep })); if (!r.ok) return toast(r.error, true); const sc = r.scan; Object.assign(S.clean, { items: sc.items, gen: sc.gen, coverage: sc.coverage, deep }); const L = LS('clean'); L.sel.clear(); L.focus = null; }
async function loadStartup() { const r = await run('Reading startup entries…', () => call('startup.list')); if (r.ok) { S.startup.items = r.items; S.startup.coverage = r.coverage; } else toast(r.error, true); }
async function loadPrograms() { const r = await run('Reading installed programs…', () => call('programs.list')); if (r.ok) S.programs.items = r.items; else toast(r.error, true); }
async function loadServices() { const r = await run('Reading services…', () => call('services.list', { drivers: S.services.drivers })); if (r.ok) S.services.items = r.items; else toast(r.error, true); }
async function loadDrivers() { const r = await run('Reading installed drivers…', () => call('drivers.list')); if (r.ok) S.drivers.items = r.items; else { S.drivers.items = []; toast(r.error, true); } }
async function loadProcs() { const r = await run('Reading processes…', () => call('processes.list')); if (r.ok) S.procs.items = r.items; else toast(r.error, true); }
async function loadSys() { const r = await call('sys.info'); if (r.ok) S.sys = r; }
async function loadPage() {
  const p = S.page;
  if (p === 'today') { loadJournal().then(() => S.page === 'today' && draw()); loadDrives().then(() => S.page === 'today' && draw()); }
  else if (p === 'clean' && !S.clean.items) { draw(); await loadClean(false); }
  else if (p === 'programs' && !S.programs.items) { draw(); await loadPrograms(); }
  else if (p === 'startup' && !S.startup.items) { draw(); await loadStartup(); }
  else if (p === 'services' && !S.services.items) { draw(); await loadServices(); }
  else if (p === 'drivers' && !S.drivers.items) { draw(); await loadDrivers(); }
  else if (p === 'procs') { if (!S.procs.items) draw(); await loadProcs(); }
  else if (p === 'storage') { if (!S.storage.drives) await loadDrives(); }
  else if (p === 'tools') { await loadSys(); }
  else if (p === 'journal') { await Promise.all([loadJournal(), loadBackups()]); }
  else if (p === 'files' || p === 'settings') { await loadScan(); }
  if (S.page === p) draw();
}

  const mode = await modal({ title: force ? `Force remove ${plural(items.length, 'program', 'programs')}?` : `Uninstall ${plural(items.length, 'program', 'programs')}?`, body: force ? 'This skips the official uninstaller. Use it only when the uninstaller is broken or missing. Feather lists the programs’ folders, registry keys and startup entries, and you choose what to delete.' : 'Standard opens each program’s own uninstaller window, one after another. Silent runs without windows where the program documents a silent switch; others are skipped. Afterwards Feather lists all leftovers for your review.', items: items.map(e => e.name + (force ? '' : e.silent ? ' (silent available)' : '')), buttons }); if (!mode) return;

  toast(`${force ? removed + ' analysed' : removed + ' removed'}${failed ? ', ' + failed + ' failed' : ''}${skipped ? ', ' + skipped + ' skipped (no silent switch)' : ''}${note ? '. ' + note : ''}`, failed > 0);

A.admin = async () => { const r = await call('app.restartAdmin'); if (!r.ok) toast(r.error, true); };
A.checkUpdate = async () => { S.update = await run('Checking for updates…', () => call('update.check')); draw(); };
A.updInstall = async () => { const ok = await modal({ title: `Update to ${S.update.version}?`, body: esc(S.update.notes || 'A newer version is available.') + '<br><br>The download is verified (size and SHA-256) before it is installed. Feather will restart.', confirm: 'Download and install' }); if (!ok) return; on('download', d => d.all && setBusy(`Downloading… ${Math.round(d.got / d.all * 100)}%`)); const r = await run('Downloading update…', () => call('update.install')); if (!r.ok) toast(r.error, true); };
A.aboutMenu = () => { if ($('.menu')) return closeMenu(); const m = document.createElement('div'); m.className = 'menu'; m.innerHTML = '<button data-act="about">About Feather System Utilities</button><button data-act="shortcuts">Keyboard shortcuts</button><button data-act="checkUpdate2">Check for updates</button><button data-act="openData">Open data folder</button><button data-act="licenses">Third-party licences</button>'; document.body.appendChild(m); };
function closeMenu() { const m = $('.menu'); if (m) m.remove(); }
A.about = () => note('About Feather System Utilities', `<b>Version ${esc(S.info.version || '')}</b> · built ${esc(S.info.built || '')}<br>Developed by <b>Akshaya Simha</b><br><br>A private, offline maintenance suite for Windows 7–11. No telemetry: the only network feature is the optional update check, and driver updates, which are fetched by Windows Update itself.<br><br>Every change is previewed first, backed up where possible, and recorded in the Journal.<br><br><span class="muted">Data folder: ${esc(S.info.dataDir || '')}</span>`);
A.shortcuts = () => note('Keyboard shortcuts', '<table style="width:100%"><tr><td><kbd>Ctrl</kbd>+<kbd>A</kbd></td><td>Select all rows in the list</td></tr><tr><td><kbd>Ctrl</kbd>/<kbd>Shift</kbd> + click</td><td>Add to / extend the selection</td></tr><tr><td><kbd>Space</kbd></td><td>Tick / untick the current row</td></tr><tr><td><kbd>↑</kbd> <kbd>↓</kbd></td><td>Move through rows (<kbd>Shift</kbd> extends)</td></tr><tr><td><kbd>Esc</kbd></td><td>Clear the selection</td></tr><tr><td><kbd>/</kbd></td><td>Jump to the search box</td></tr><tr><td><kbd>Delete</kbd></td><td>Delete / remove the selection (always asks first)</td></tr></table>');
A.checkUpdate2 = async () => { await A.checkUpdate(); S.update && S.update.ok ? toast(S.update.newer ? `Version ${S.update.version} is available.` : 'You are up to date.') : toast((S.update && S.update.error) || 'Update check failed.', true); };
A.licenses = () => note('Third-party licences', 'Microsoft Edge WebView2 SDK (BSD-style licence) · NSIS installer (zlib licence) · GCC runtime (GPLv3 with Runtime Library Exception). No other third-party code is included.');

// ======================= events =======================
function activeList() { const p = S.page; if (p === 'files') return LS(S.files.mode); if (p === 'drivers') return LS(S.drivers.tab === 'installed' ? 'drvinst' : 'drvupd'); return { clean: 'clean', startup: 'startup', programs: 'programs', services: 'services', procs: 'procs', journal: 'journal' }[p] ? LS(p) : null; }
document.addEventListener('click', async e => {
  const t = e.target; if (!t.closest('.menu') && !t.closest('[data-act=aboutMenu]')) closeMenu();
  const g = t.closest('[data-go]'); if (g) return go(g.dataset.go);
  const a = t.closest('[data-act]'); if (a) { if (a.disabled) return; closeMenu(); const f = A[a.dataset.act]; if (f) await f(a); return; }
  const sw = t.closest('[data-toggle]'); if (sw) { e.stopPropagation(); if (sw.disabled) return; const e1 = S.startup.items.find(x => x.key === sw.dataset.toggle), en = e1.state !== 'Enabled'; const r = await run('Applying…', () => call('startup.set', { keys: [e1.key], enable: en })); toast(r.ok ? `${e1.name} ${en ? 'enabled' : 'disabled'}. Reversible any time.` : r.error, !r.ok); await loadStartup(); loadJournal(); draw(); return; }
  const set = t.closest('[data-set]'); if (set) { const k = set.dataset.set, v = !S.info[k]; await call('app.set', { key: k, value: v }); S.info[k] = v; draw(); return; }
  const all = t.closest('input[data-all]'); if (all) { const L = S.lists[all.dataset.all]; L.sel = all.checked ? new Set(L.order) : new Set(); draw(); return; }
  const row = t.closest('tr[data-ix]'); if (row) { if (t.closest('button,a,select')) return; pickRow(S.lists[row.dataset.l], +row.dataset.ix, e, !!t.closest('input[data-chk]')); return; }
  const th = t.closest('th[data-sort]'); if (th) { const L = S.lists[th.dataset.l]; L.sort = [th.dataset.sort, L.sort && L.sort[0] === th.dataset.sort ? -L.sort[1] : 1]; draw(); return; }
  const fc = t.closest('[data-fc]'); if (fc) { const [id, field, val] = fc.dataset.fc.split('|'); LS(id).f[field] = val; draw(); return; }
  const ft = t.closest('[data-ft]'); if (ft) { S.files.mode = ft.dataset.ft; draw(); return; }
  const dt = t.closest('[data-dtab]'); if (dt) { S.drivers.tab = dt.dataset.dtab; draw(); return; }
  const dv = t.closest('[data-drive],[data-path]'); if (dv && S.page === 'storage') { await openFolder(dv.dataset.drive || dv.dataset.path); return; }
});
document.addEventListener('input', e => { const q = e.target.dataset && e.target.dataset.q; if (q) { LS(q).q = e.target.value; draw(); } });
document.addEventListener('change', async e => { const el = e.target, id = el.id;
  if (el.dataset.fs) { const [lid, field] = el.dataset.fs.split('|'); LS(lid).f[field] = el.value; draw(); return; }
  if (el.dataset.fchk) { const [lid, field] = el.dataset.fchk.split('|'); LS(lid).f[field] = field === 'admin' ? (el.checked ? 'no' : '') : el.checked; draw(); return; }
  if (id === 'drv') { S.services.drivers = el.checked; S.services.items = null; draw(); await loadServices(); draw(); }
  else if (id === 'stypeBatch' && el.value) { const L = LS('services'), sel = selectedOf(L, S.services.items, x => x.name), type = el.value, lbl = el.options[el.selectedIndex].text; el.value = '';
    if (!sel.length || !await modal({ title: `Set start type to ${lbl}?`, body: 'Critical services are skipped. This is recorded in the Journal and can be reversed.', items: sel.map(x => `${x.display} (now ${x.start})`), confirm: 'Apply' })) return;
    let ok = 0, bad = 0, first = ''; for (const x of sel) { const r = await run(`${x.display}…`, () => call('services.startType', { name: x.name, type })); if (r.ok) ok++; else { bad++; first = first || `${x.display}: ${r.error}`; } }
    toast(`${ok} changed${bad ? ', ' + bad + ' skipped/failed: ' + first : ''}`, bad > 0); await loadServices(); loadJournal(); draw(); }
  else if (id === 'largeMin') { await call('app.set', { key: 'largeMinMB', value: +el.value }); S.info.largeMinMB = +el.value; }
  else if (id === 'dupMin') { await call('app.set', { key: 'dupMinKB', value: +el.value }); S.info.dupMinKB = +el.value; } });
document.addEventListener('keydown', e => {
  if ($('#layer').children.length) return; const tg = e.target, typing = tg && /^(INPUT|SELECT|TEXTAREA)$/.test(tg.tagName) && tg.type !== 'checkbox';
  if (e.key === '/' && !typing) { const q = document.querySelector('input[data-q]'); if (q) { e.preventDefault(); q.focus(); } return; }
  if (typing) return; const L = activeList(); if (!L || !L.order.length) return; const ix = L.focus == null ? -1 : L.order.indexOf(L.focus);
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'a') { e.preventDefault(); L.sel = new Set(L.order); draw(); }
  else if (e.key === 'Escape') { L.sel.clear(); draw(); }
  else if (e.key === ' ' && ix >= 0) { e.preventDefault(); L.sel.has(L.focus) ? L.sel.delete(L.focus) : L.sel.add(L.focus); L.anchor = ix; draw(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = Math.max(0, Math.min(L.order.length - 1, ix + (e.key === 'ArrowDown' ? 1 : -1))); if (e.shiftKey) { if (L.anchor < 0) L.anchor = ix < 0 ? n : ix; const [a, b] = [L.anchor, n].sort((x, y) => x - y); L.sel = new Set(L.order.slice(a, b + 1)); } else { L.sel = new Set([L.order[n]]); L.anchor = n; } L.focus = L.order[n]; S.scrollFocus = true; draw(); }
  else if (e.key === 'Delete' && L.sel.size) { const act = { startup: 'suDelete', procs: 'procEnd' }[S.page]; if (S.page === 'files') A.fileRemove({ dataset: { v: e.shiftKey ? '1' : '0' } }); else if (act) A[act](); }
});
on('goto', d => { const m = { speed: 'startup', toolbox: 'tools', large: 'files', dupes: 'files', empty: 'files', history: 'journal' }; if (['large', 'dupes', 'empty'].includes(d.page)) S.files.mode = d.page; go(m[d.page] || d.page); });

// ======================= boot =======================
(async function () {
  draw(); const r = await call('app.info'); if (r.ok) S.info = r; draw(); loadPage();
  if (S.info.autoUpdate) { const u = await call('update.check'); if (u.ok) { S.update = u; draw(); } }
})();
</script></body></html>
