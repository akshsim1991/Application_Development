<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F9BFF"/><stop offset="1" stop-color="#1D4FD8"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE0FF"/><stop offset="1" stop-color="#F4F9FF"/>
    </linearGradient>
    <linearGradient id="feather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE9FF"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#0B2A7A" flood-opacity="0.38"/>
    </filter>
    <clipPath id="photoClip"><rect x="34" y="62" width="150" height="120" rx="14"/></clipPath>
  </defs>
  <!-- app tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="120" rx="56" fill="#FFFFFF" opacity="0.10"/>
  <!-- the picture: a photo card with a sun and mountains -->
  <g transform="rotate(-7 109 122)" filter="url(#shadow)">
    <rect x="30" y="58" width="158" height="128" rx="18" fill="#FFFFFF"/>
    <g clip-path="url(#photoClip)" transform="translate(0 0)">
      <rect x="38" y="66" width="142" height="112" rx="10" fill="url(#sky)"/>
      <circle cx="146" cy="96" r="14" fill="#FFC857"/>
      <path d="M38 178 L38 138 L76 100 L104 128 L124 112 L180 160 L180 178 Z" fill="#2C6BE0"/>
      <path d="M38 178 L38 156 L66 134 L96 160 L120 140 L180 178 Z" fill="#1B47B8"/>
    </g>
  </g>
  <!-- the feather -->
  <g transform="translate(170 132) rotate(32) scale(1.02)" filter="url(#shadow)">
    <path d="M0 -104 C 40 -76 54 -24 32 28 C 20 56 7 80 0 98 C -7 80 -20 56 -32 28 C -54 -24 -40 -76 0 -104 Z" fill="url(#feather)"/>
    <path d="M0 -104 C 40 -76 54 -24 32 28 C 20 56 7 80 0 98 Z" fill="#B9D2FF" opacity="0.55"/>
    <path d="M0 -96 L0 120" stroke="#6E9BEA" stroke-width="5" stroke-linecap="round" fill="none"/>
    <g stroke="#7FA6EE" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85">
      <path d="M0 -62 L24 -78"/><path d="M0 -62 L-22 -78"/>
      <path d="M0 -36 L33 -56"/><path d="M0 -36 L-31 -56"/>
      <path d="M0 -8 L36 -30"/><path d="M0 -8 L-34 -30"/>
      <path d="M0 22 L30 2"/><path d="M0 22 L-28 2"/>
      <path d="M0 50 L19 34"/><path d="M0 50 L-17 34"/>
    </g>
  </g>
</svg>
