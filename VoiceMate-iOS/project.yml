name: VoiceMate
options:
  bundleIdPrefix: com.akshayasimha
  deploymentTarget:
    iOS: "17.0"
targets:
  VoiceMate:
    type: application
    platform: iOS
    sources: [VoiceMate]
    info:
      path: VoiceMate/Info.plist
      properties:
        CFBundleDisplayName: VoiceMate
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        NSMotionUsageDescription: VoiceMate uses motion sensors to detect a possible crash while you ride.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSMicrophoneUsageDescription: VoiceMate listens through your headphones' microphone to hear your questions.
        NSLocationWhenInUseUsageDescription: VoiceMate tells you your speed and location when you ask.
        NSAppleMusicUsageDescription: VoiceMate controls music playback by voice.
        NSSpeechRecognitionUsageDescription: VoiceMate converts your speech to text to answer you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshayasimha.voicemate
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
