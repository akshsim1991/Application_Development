name: VoiceMate
options:
  bundleIdPrefix: com.akshayasimha
  deploymentTarget:
    iOS: "17.0"
targets:
  VoiceMate:
    type: application
    platform: iOS
    sources: [VoiceMate]
    info:
      path: VoiceMate/Info.plist
      properties:
        CFBundleDisplayName: RideVoice
        CFBundleShortVersionString: "2.0"
        CFBundleVersion: "2"
        NSPersonalVoiceUsageDescription: RideVoice can use a Personal Voice you created on this iPhone to speak directions.
        NSMotionUsageDescription: RideVoice uses motion sensors to detect a possible crash while you ride.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, location]
        NSMicrophoneUsageDescription: RideVoice listens through your headphones' microphone to hear your questions.
        NSLocationWhenInUseUsageDescription: RideVoice tells you your speed and location when you ask.
        NSLocationTemporaryUsageDescriptionDictionary:
          Navigation: RideVoice needs precise location to show your speed and give turn-by-turn directions.
        NSAppleMusicUsageDescription: RideVoice controls music playback by voice.
        NSSpeechRecognitionUsageDescription: RideVoice converts your speech to text to answer you.
    scheme:
      testTargets: [VoiceMateTests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshayasimha.voicemate
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VoiceMateTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VoiceMateTests]
    dependencies:
      - target: VoiceMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.akshayasimha.voicemate.tests
        SWIFT_VERSION: "5.0"
